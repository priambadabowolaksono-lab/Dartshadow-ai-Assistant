<title>DS-07</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: HUD satu layar — panel arsip di kiri, kanal komunikasi DS-07 di kanan; laci di HP.
   Satu dunia visual gelap (Neo Tokyo, hujan merah) — sengaja tidak punya tema terang. */
:root{
  color-scheme:dark;
  --void:#07080b;        /* latar: hitam kebiruan */
  --panel:#0d0f14;       /* permukaan panel */
  --panel-2:#13161d;     /* permukaan terangkat */
  --line:#242833;        /* garis tipis */
  --silver:#c9ced6;      /* aksen perak (bracer) */
  --fg:#e9e7e4;          /* teks utama */
  --muted:#8b909b;       /* teks sekunder */
  --red:#ff3b4f;         /* mata DS — senjata, normal */
  --red-deep:#9e1626;    /* retakan merah */
  --amber:#f0a44a;       /* Kai — ingatan, arsip */
  --gold:#ffd76a;        /* pilihan — hal yang disimpan */
  --pink:#ffb3c8;        /* Lira — momen hangat */
  --violet:#a78bfa;      /* Voss/Rael — sistem luar */
  --green:#5fd49a;       /* Eira — status sehat */
  --eye:var(--red);
  --f-disp:"Oxanium","Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font:15px/1.6 var(--f-body);overflow:hidden}
::selection{background:var(--red-deep);color:#fff}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
a{color:var(--silver)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.app{position:relative;z-index:1;display:grid;grid-template-columns:288px minmax(0,1fr);height:100%}

/* ---------- panel samping ---------- */
.side{display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--panel) 92%,transparent);border-right:1px solid var(--line);
  padding-block:16px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand b{font:700 18px/1 var(--f-disp);letter-spacing:.12em}
.brand small{display:block;font:500 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font-weight:500}
.btn:hover{border-color:#3a3f4c}
.btn.red{border-color:var(--red-deep);background:linear-gradient(180deg,#2a0d12,#1a0a0e);color:#ffd9de}
.btn.red:hover{border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 0 10px;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:var(--void)}
.tabs button{min-height:34px;border:0;border-radius:4px;background:transparent;color:var(--muted);font:600 12px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--fg)}
.tabs button[data-k="mem"][aria-selected="true"]{color:var(--amber)}
.tabs button[data-k="ops"][aria-selected="true"]{color:var(--violet)}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-right:-6px;padding-right:6px}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;border-radius:var(--r);padding:8px 8px 8px 10px;border:1px solid transparent}
.conv:hover{background:var(--panel-2)}
.conv[aria-current="true"]{background:var(--panel-2);border-color:var(--line);box-shadow:inset 2px 0 0 var(--red)}
.conv button.open{all:unset;cursor:pointer;min-width:0;display:block;border-radius:4px}
.conv button.open:focus-visible,.chip button:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.conv .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.conv .d{display:block;font:11px/1.4 var(--f-mono);color:var(--muted)}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--line);background:var(--panel-2)}
.iconbtn svg{width:16px;height:16px}
.conv .iconbtn{opacity:0}
.conv:hover .iconbtn,.conv:focus-within .iconbtn{opacity:1}
.empty-note{color:var(--muted);font-size:13px;padding:10px 4px;line-height:1.5}
.ops-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px;font:600 10px/1 var(--f-disp);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.rep{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);margin-bottom:10px}
.rep b{font:600 13px/1.3 var(--f-disp);letter-spacing:.06em}
.rep p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 8px 7px 10px;border-radius:var(--r)}
.req:hover{background:var(--panel-2)}
.req .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.ok{color:var(--green);border-color:#1f4d36}.st.run{color:var(--amber);border-color:#4a3418}.st.bad{color:var(--red);border-color:var(--red-deep)}
.opsf{margin-top:12px;border:1px solid #2b3140;border-left:2px solid var(--violet);border-radius:var(--r);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:10px}
.opsf .lbl{font:600 10px/1 var(--f-disp);letter-spacing:.16em;color:var(--violet);text-transform:uppercase}
.opsf .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opsf label{display:flex;flex-direction:column;gap:4px;font:11px/1.3 var(--f-mono);color:var(--muted);min-width:0}
.opsf label.w{grid-column:1/-1}
.opsf input,.opsf select{min-height:36px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--void);color:var(--fg);font:14px var(--f-body);min-width:0;width:100%;box-sizing:border-box}
.opsf .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opsf .res{font-size:13px}
@media (max-width:520px){.opsf .g{grid-template-columns:minmax(0,1fr)}}
.memadd{display:flex;gap:6px;margin-bottom:8px}
.memadd input{flex:1;min-width:0;min-height:36px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--void)}
.frag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start;padding:8px 8px 8px 10px;border-radius:var(--r);border:1px solid #3a2a14;background:linear-gradient(180deg,#17120b,#110e0a)}
.frag p{margin:0;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.frag .d{font:10px/1.4 var(--f-mono);color:#b98a4c;letter-spacing:.06em}
.foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font:11px/1.5 var(--f-mono);color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.warn{background:var(--amber)}
.dot.off{background:#4a4f5a}

/* ---------- kanal utama ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--void) 80%,transparent);backdrop-filter:blur(6px)}
.menu{display:none}
.ident{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.ident h1{margin:0;font:700 20px/1 var(--f-disp);letter-spacing:.14em}
.status{font:500 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.status b{color:var(--eye);font-weight:500}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:var(--void)}
.seg button{border:0;background:transparent;color:var(--muted);min-height:32px;padding:0 12px;border-radius:4px;font:600 12px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.seg button[data-m="ovf"][aria-pressed="true"]{background:#2a0d12;color:var(--red);box-shadow:0 0 14px #ff3b4f33}
.toggles{display:flex;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--muted);font:500 12px/1 var(--f-mono)}
.tg[aria-pressed="true"]{color:var(--fg);border-color:#3a3f4c;background:var(--panel-2)}
.tg[aria-pressed="true"] .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.tg svg{width:14px;height:14px}

/* avatar: kepala bulat hitam tanpa wajah, dua mata menyapu */
.ava{flex:none;display:block}
.ava .head{stroke:#2c3039;stroke-width:1.2}
.ava .eye{fill:var(--eye);filter:drop-shadow(0 0 3px var(--eye)) drop-shadow(0 0 8px var(--eye));transition:fill .5s}
.ava .crack{stroke:var(--red);stroke-width:1;fill:none;opacity:0;transition:opacity .4s}
.think .ava .eye{animation:pulse 1.1s ease-in-out infinite}
.ovf .ava .crack{opacity:.8}
.ovf{--eye:#ff2a40}
.flash-gold{--eye:var(--gold)}
.flash-pink{--eye:var(--pink)}
.blink .ava .eyes{animation:blink .22s ease-in-out 1}
.ava .eyes{transform-origin:50% 52%;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{transform:scaleY(.1)}}

.log{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.log-in{max-width:820px;margin:0 auto;padding-block:24px 32px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.msg .who{font:600 11px/1 var(--f-disp);letter-spacing:.14em;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.msg.u .who{color:var(--silver)}
.msg .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-top:-4px}
.msg.u .mk{border:1px solid var(--line);background:var(--panel-2);color:var(--silver)}
.msg.u .mk svg{width:14px;height:14px}
.msg.u .body{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--void);font:11px/1.5 var(--f-mono);color:var(--muted)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.chip img{width:22px;height:22px;object-fit:cover;border-radius:3px}
.chip button{all:unset;cursor:pointer;color:var(--muted);padding:0 2px}
.chip button:hover{color:var(--red)}

/* jawaban DS-07 */
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .75em}
.md h2,.md h3,.md h4{font-family:var(--f-disp);letter-spacing:.04em;margin:1.1em 0 .4em;line-height:1.25;text-wrap:balance}
.md h2{font-size:19px}.md h3{font-size:17px}.md h4{font-size:15px;color:var(--silver)}
.md ul,.md ol{margin:0 0 .75em;padding-left:1.4em}
.md li{margin:.15em 0}
.md li::marker{color:var(--red)}
.md code{font:13px/1.5 var(--f-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.md pre{position:relative;margin:0 0 .9em;background:#0a0b0f;border:1px solid var(--line);border-left:2px solid var(--red-deep);border-radius:var(--r);overflow:auto}
.md pre code{display:block;padding:12px 14px;border:0;background:none;white-space:pre;font-size:13px}
.md pre .cp{position:absolute;top:6px;right:6px;color:var(--muted)}
.md pre .cp svg{width:14px;height:14px}
.md blockquote{margin:0 0 .8em;padding:2px 0 2px 14px;border-left:2px solid var(--amber);color:#d9cbb6}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md .tw{overflow-x:auto;margin:0 0 .9em}
.md table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel-2);font-weight:600}
.md a{color:#ffc2c9;text-decoration-color:#ff3b4f66}
.md strong{color:#fff}

.scan{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font:12px/1.5 var(--f-mono);color:var(--muted)}
.scan div::before{content:"▸ ";color:var(--red)}
.scan div.done::before{content:"✓ ";color:var(--green)}
.thinking{font:12px/1.5 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.thinking::after{content:"";display:inline-block;width:8px;height:12px;margin-left:6px;background:var(--eye);vertical-align:-1px;animation:pulse .9s steps(2) infinite}
.err{border:1px solid var(--red-deep);background:#1a0a0e;border-radius:var(--r);padding:10px 12px;color:#ffd0d6;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tools .btn{min-height:30px;padding:0 9px;font-size:12px;color:var(--muted);background:transparent}
.tools .btn:hover{color:var(--fg)}
.tools .btn svg{width:14px;height:14px}
.src{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.src h5{margin:0 0 6px;font:600 10px/1 var(--f-disp);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.src ol{margin:0;padding-left:1.3em;font-size:13px}
.src li{margin:2px 0;overflow-wrap:anywhere}
.src a{color:var(--silver)}
.prop{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.prop .frag{grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.prop .lbl{font:600 10px/1 var(--f-disp);letter-spacing:.16em;color:var(--amber);text-transform:uppercase}

/* layar kosong */
.hello{margin:auto 0;padding-top:8vh;display:flex;flex-direction:column;gap:18px}
.hello .eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.2em;color:var(--red)}
.hello h2{margin:0;font:700 clamp(28px,5vw,44px)/1.05 var(--f-disp);letter-spacing:.04em;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:56ch}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.sugg button{text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--fg);line-height:1.45}
.sugg button:hover{border-color:#3a3f4c;background:var(--panel-2)}
.sugg small{display:block;font:500 10px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.notice{border:1px solid #3a2a14;background:#15100a;color:#e8cfa8;border-radius:var(--r);padding:10px 12px;font-size:13px}

/* komposer */
.comp{padding-block:10px 14px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:color-mix(in srgb,var(--void) 88%,transparent)}
.comp-in{max-width:820px;margin:0 auto}
.box{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:end;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:#3a3f4c}
.ovf .box{border-color:var(--red-deep);box-shadow:0 0 0 1px #ff3b4f22,0 0 24px #ff3b4f1a}
.box textarea{box-sizing:border-box;resize:none;border:0;background:transparent;outline:none;height:40px;min-height:40px;max-height:200px;padding:9px 6px;line-height:1.5;overflow-x:hidden}
.box textarea::placeholder{color:#666b76}
.send{width:40px;height:40px;border-radius:8px;border:1px solid var(--red-deep);background:linear-gradient(180deg,#3a0f17,#250a10);color:#ffd9de;display:grid;place-items:center}
.send:hover{border-color:var(--red)}
.send svg,.box .iconbtn svg{width:18px;height:18px}
.box .iconbtn{width:40px;height:40px}
.mic[aria-pressed="true"]{color:var(--red);border-color:var(--red-deep);animation:pulse 1.2s infinite}
.hint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;font:11px/1.4 var(--f-mono);color:#5f6470}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.drop{outline:2px dashed var(--red);outline-offset:-6px}

/* boot */
#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--void);transition:opacity .45s}
#boot.out{opacity:0;pointer-events:none}
#boot .core{display:flex;flex-direction:column;align-items:center;gap:16px}
#boot .ava .eye{animation:ignite .9s ease-out both}
#boot .ava .eye+.eye{animation-delay:.12s}
#boot .ln{width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);transform:scaleX(0);animation:fuse .7s .1s ease-out forwards}
#boot .tx{font:500 11px/1.6 var(--f-mono);letter-spacing:.24em;color:var(--muted);text-align:center;min-height:3.2em}
@keyframes ignite{0%{opacity:0}40%{opacity:.2}55%{opacity:1}65%{opacity:.4}100%{opacity:1}}
@keyframes fuse{to{transform:scaleX(1)}}

/* dialog */
.scrim{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#000a;padding:16px}
.dlg{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 20px 60px #000c}
.dlg h3{margin:0 0 6px;font:700 16px/1.2 var(--f-disp);letter-spacing:.08em}
.dlg p{margin:0 0 16px;color:var(--muted);font-size:14px}
.dlg .row{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:13px;box-shadow:0 8px 30px #000a;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:30;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none;box-shadow:20px 0 60px #000c}
  .menu{display:inline-grid}
  .top{padding-left:max(12px,env(safe-area-inset-left,0px));gap:8px}
  .log-in,.comp{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .sugg{grid-template-columns:minmax(0,1fr)}
  .status{display:none}
  .conv .iconbtn{opacity:1}
}
@media (max-width:520px){
  .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto}
  .seg{grid-column:1/-1;justify-self:stretch;display:grid;grid-template-columns:repeat(3,1fr)}
  .toggles{grid-column:3;grid-row:1}
  .tg .lab{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .log{scroll-behavior:auto}
}
</style>

<canvas id="rain" aria-hidden="true"></canvas>

<div id="boot" aria-hidden="true">

/* ===================== MARKDOWN (aman) ===================== */
function inlineMd(s){
  let t = esc(s);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_,c) => { codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_,a,u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${a}</a>`);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_,p,u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return t.replace(/\u0000(\d+)\u0000/g, (_,i) => `<code>${codes[+i]}</code>`);
}
function md(src){
  const out = []; const lines = String(src).replace(/\r/g,"").split("\n");
  let i = 0, para = [];
  const flush = () => { if (para.length){ out.push("<p>"+para.map(inlineMd).join("<br>")+"</p>"); para = []; } };
  while (i < lines.length){
    const l = lines[i];
    const fence = l.match(/^\s*```\s*([\w+-]*)/);
    if (fence){
      flush(); const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><button class="btn sm ghost cp" type="button" data-copy>${IC.copy}<span class="sr">Salin kode</span></button><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    if (/^\s*$/.test(l)){ flush(); i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h){ flush(); const n = Math.min(4, h[1].length+1); out.push(`<h${n}>${inlineMd(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ flush(); out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i+1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      out.push(`<div class="tw"><table><thead><tr>${head.map(c=>`<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*>/.test(l)){
      flush(); const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue;
    }
    const li = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)/);
    if (li){
      flush(); const ordered = /\d/.test(li[1]); const items = [];
      while (i < lines.length){
        const m = lines[i].match(/^\s*([-*+]|\d+[.)])\s+(.*)/);
        if (m && /\d/.test(m[1]) === ordered) { items.push(m[2]); i++; }
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length-1] += " " + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map(x=>`<li>${inlineMd(x)}</li>`).join("")}</${tag}>`); continue;
    }
    para.push(l); i++;
  }
  flush();
  return out.join("");
}

const Store = {

  convCol(){ return S.db.collection(`data/users/${S.uid}/convs/items`); },
  memCol(){ return S.db.collection(`data/users/${S.uid}/mem/items`); },
  start(){
    if (S.storage === "db"){
      let gotC = false, gotM = false;
      const timer = setTimeout(()=>{ if (!gotC) { S.convsLoading = false; renderSide(); } }, 10000);
      this.unsubs.push(this.convCol().orderBy("updated","desc").limit(60).onSnapshot(snap=>{
        gotC = true; clearTimeout(timer); S.convsLoading = false;
        S.convs = snap.docs.map(d => ({id:d.id, ...d.data()}));
        const cur = S.convs.find(c => c.id === S.convId);
        if (cur && !S.busy && !S.localDirty && (cur.messages||[]).length !== (S.cur?.messages||[]).length){ S.cur = structuredClone(cur); renderLog(); }
        renderSide();
      }, e => { S.convsLoading = false; renderSide(); toast("Arsip tidak bisa dimuat: "+(e.message||e.code)); }));
      this.unsubs.push(this.memCol().orderBy("created","asc").limit(200).onSnapshot(snap=>{
        gotM = true; S.mems = snap.docs.map(d => ({id:d.id, ...d.data()})); renderSide();
      }, e => toast("Ingatan tidak bisa dimuat: "+(e.message||e.code))));
    } else {
      S.convs = lsGet("ds07.convs", []); S.mems = lsGet("ds07.mems", []); S.convsLoading = false; renderSide();

  async saveConv(c){
    c.updated = Date.now();
    // satu dokumen maksimal 256 KiB: buang pesan tertua bila perlu
    while (bytes(JSON.stringify(c)) > 230000 && c.messages.length > 2) { c.messages.splice(0, 2); c.trimmed = true; }
    if (S.storage === "db"){
      try{ await this.convCol().doc(c.id).set(JSON.parse(JSON.stringify(c))); }
      catch(e){ toast(e.code === "quota_exceeded" ? "Penyimpanan penuh — hapus beberapa percakapan lama." : "Gagal menyimpan percakapan."); }
    } else {
      const i = S.convs.findIndex(x => x.id === c.id);
      if (i >= 0) S.convs[i] = structuredClone(c); else S.convs.unshift(structuredClone(c));
      S.convs.sort((a,b)=>b.updated-a.updated); lsSet("ds07.convs", S.convs.slice(0,40)); renderSide();
    }
  },
  async delConv(id){
    if (S.storage === "db"){ try{ await this.convCol().doc(id).delete(); }catch{ toast("Gagal menghapus."); } }
    else { S.convs = S.convs.filter(c => c.id !== id); lsSet("ds07.convs", S.convs); renderSide(); }
  },
  async addMem(text){
    const m = {text:String(text).slice(0,400), created:Date.now()};
    if (S.storage === "db"){ try{ await this.memCol().add(m); }catch(e){ toast("Gagal menyimpan ingatan."); return false; } }
    else { S.mems.push({id:uid(), ...m}); lsSet("ds07.mems", S.mems); renderSide(); }
    return true;
  },
  async delMem(id){
    if (S.storage === "db"){ try{ await this.memCol().doc(id).delete(); }catch{ toast("Gagal menghapus ingatan."); } }
    else { S.mems = S.mems.filter(m => m.id !== id); lsSet("ds07.mems", S.mems); renderSide(); }
  }
};

const TEXT_EXT = /\.(txt|md|csv|json|html|css|js|ts|py|xml|ya?ml|log|tsv|sql)$/i;
async function addFiles(list){
  for (const f of list){
    if (S.pending.length >= 8){ toast("Maksimal 8 lampiran sekaligus."); break; }
    if (f.type.startsWith("image/")){
      const lim = S.limits?.images;
      if (!lim){ toast("Gambar tidak bisa dikirim ke AI di tampilan ini."); continue; }
      if (lim.mediaTypes && !lim.mediaTypes.includes(f.type)){ toast(`${f.name}: format gambar tidak didukung.`); continue; }
      if (f.size > lim.maxInputBytes){ toast(`${f.name}: gambar terlalu besar.`); continue; }
      if (S.pending.filter(p=>p.kind==="img").length >= lim.maxCount){ toast(`Maksimal ${lim.maxCount} gambar.`); continue; }
      S.pending.push({kind:"img", name:f.name, blob:f, url:URL.createObjectURL(f)});
    } else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)){
      const t = await pdfText(f); if (t == null) continue;
      S.pending.push({kind:"txt", name:f.name, text:t});
    } else if (TEXT_EXT.test(f.name) || f.type.startsWith("text/")){
      if (f.size > 2_000_000){ toast(`${f.name}: file terlalu besar (maks 2 MB).`); continue; }
      S.pending.push({kind:"txt", name:f.name, text:await f.text()});
    } else toast(`${f.name}: jenis file belum didukung.`);
  }
  renderPending();
}
const PDF_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLoading;
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
function loadPdf(){
  // pdf.worker dimuat sebagai skrip biasa: pdf.js lalu berjalan di thread utama,
  // karena CSP artifact tidak mengizinkan Worker dari origin lain.
  pdfLoading ||= loadScript(PDF_BASE + "pdf.min.js").then(() => loadScript(PDF_BASE + "pdf.worker.min.js"));
  return pdfLoading;
}
async function pdfText(f){
  toast("Membaca PDF…");
  try{ await loadPdf(); }catch{ pdfLoading = null; toast("Pembaca PDF tidak termuat. Periksa koneksi lalu coba lagi."); return null; }
  const lib = window.pdfjsLib;
  try{
    const doc = await lib.getDocument({data: await f.arrayBuffer(), isEvalSupported:false}).promise;
    let out = ""; const n = Math.min(doc.numPages, 60);
    for (let p = 1; p <= n; p++){
      const pg = await doc.getPage(p); const tc = await pg.getTextContent();
      out += `\n[Hal. ${p}]\n` + tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("");
      if (out.length > 120000) break;
    }
    if (doc.numPages > n) out += `\n[… ${doc.numPages-n} halaman berikutnya tidak dibaca]`;
    if (!out.trim()){ toast(`${f.name}: PDF ini berupa gambar hasil scan — kirim sebagai gambar.`); return null; }
    return out;
  }catch(e){ toast(`${f.name}: PDF tidak bisa dibaca.`); return null; }
}

/* ===================== DESIGN OPS (jembatan) ===================== */
// Dua artifact tidak bisa saling membaca database. Jembatannya tugas Claude terjadwal di cloud:
//  - "input": dipicu DS-07 per permintaan; membaca ops/<req_…> lalu menulis project ke Design Ops.
//  - "laporan": tiap pagi (atau saat diminta) membaca Design Ops lalu menulis ops/lap_<tanggal> + ops/katalog.
// Koleksi "ops" hanya bisa dibaca/ditulis pemilik artifact (lihat aturan db saat publish).
const opsReady = () => !!(S.ops.ok && S.ops.config);
const canFire = () => !!(S.mcp && opsReady());
const OPS_ST = {antri:["Antri","run"], diproses:["Diproses","run"], selesai:["Masuk","ok"], gagal:["Gagal","bad"]};
const Ops = {
  start(){
    if (!S.db || !S.isOwner) { S.ops.ok = false; return; }
    S.db.collection("ops").limit(300).onSnapshot(snap => {
      const docs = snap.docs.map(d => ({id:d.id, ...d.data()}));
      S.ops.config = docs.find(d => d.id === "config") || null;
      S.ops.katalog = docs.find(d => d.id === "katalog") || null;
      S.ops.reqs = docs.filter(d => d.kind === "req").sort((a,b) => (b.at||0) - (a.at||0));
      S.ops.reports = docs.filter(d => d.kind === "laporan").sort((a,b) => String(b.date).localeCompare(String(a.date)));
      S.ops.ok = true; renderSide();
      if (!S.busy && (S.cur?.messages||[]).some(m => (m.opsDrafts||[]).some(d => d.reqId))) renderLog();
    }, () => { S.ops.ok = false; renderSide(); });
  },
  async fire(which, text){
    const id = S.ops.config?.[which === "input" ? "inputTrigger" : "reportTrigger"];
    if (!id) throw new Error("Tugas cloud belum diatur.");
    if (!S.mcp) throw new Error("Konektor Claude Code Remote tidak tersedia di tampilan ini.");
    try { await S.mcp.callTool("Claude Code Remote", "fire_trigger", text ? {trigger_id:id, text} : {trigger_id:id}, {cache:false}); }
    catch(e){ throw new Error(e.code === "not_granted" || e.code === "consent_required" ? "Izin konektor Claude Code Remote belum diberikan." : e.code === "server_not_connected" || e.code === "server_not_found" ? "Konektor Claude Code Remote belum tersambung di akunmu." : "Gagal memicu tugas cloud (" + (e.code || "error") + ")."); }
  }
};
function opsPane(){
  if (!S.db) return `<div class="empty-note">Design Ops hanya tersedia saat DS-07 dibuka di claude.ai.</div>`;
  if (!S.isOwner) return `<div class="empty-note">Panel Design Ops hanya untuk pemilik DS-07.</div>`;
  if (!S.ops.ok) return `<div class="empty-note">Menyambung ke Design Ops…</div>`;
  if (!S.ops.config) return `<div class="empty-note">Jembatan Design Ops belum diatur. Minta Claude menyiapkan tugas cloud “input” dan “laporan”.</div>`;
  const r = S.ops.reports[0];

function webTools(m){
  const step = t => { const s = {t, done:false}; m.scan.push(s); updateLast(); return s; };
  const addSrc = list => { for (const r of list) if (r.url && !m.sources.some(s=>s.url===r.url)) m.sources.push({url:r.url, title:r.title}); };
  const call = async (tool, input) => {
    try{
      const res = await S.mcp.callTool("Parallel Search", tool, input, {cache:false});
      S.webState = "ok"; renderSide();
      return res.payload ?? res.structuredContent ?? (res.content||[]).map(c=>c.text||"").join("\n");
    }catch(e){
      if (["not_granted","server_not_connected","server_not_found","needs_reauth","consent_required","not_in_manifest"].includes(e.code)){
        S.webState = "gagal"; renderSide();
        throw new Error("Pencarian web tidak tersedia: sambungkan konektor Parallel Search di pengaturan claude.ai, lalu izinkan untuk DS-07.");
      }
      throw new Error("Pencarian web gagal ("+(e.code||"error")+").");
    }
  };
  const slim = (p, per=900) => {
    const rs = Array.isArray(p?.results) ? p.results : [];
    addSrc(rs);
    if (!rs.length) return typeof p === "string" ? p.slice(0, 12000) : JSON.stringify(p).slice(0, 12000);
    return rs.slice(0, 8).map((r,k) => ({n:k+1, title:r.title, url:r.url, tanggal:r.publish_date||undefined, cuplikan:(r.excerpts||[]).join(" … ").replace(/\s+/g," ").slice(0, per)}));
  };
  return [
    { name:"cari_web",
      description:"Cari di internet untuk informasi terbaru atau fakta yang perlu diverifikasi. Mengembalikan hingga 8 hasil {title,url,tanggal,cuplikan}. Kutip sumber dengan tautan markdown.",
      inputSchema:{type:"object",properties:{tujuan:{type:"string",description:"Apa yang dicari, satu kalimat"},kueri:{type:"array",items:{type:"string"},description:"2-3 kueri kata kunci, 3-6 kata"}},required:["tujuan","kueri"]},
      async execute(inp){
        const q = (Array.isArray(inp.kueri) ? inp.kueri : [String(inp.kueri||inp.tujuan||"")]).map(String).filter(Boolean).slice(0,4);
        const s = step("Memindai web: " + q.join(" · "));
        const p = await call("web_search", {objective:String(inp.tujuan||q[0]), search_queries:q, session_id:webSession});
        s.done = true; updateLast(); return slim(p);
      }},
    { name:"baca_halaman",
      description:"Baca isi halaman web tertentu bila cuplikan pencarian tidak cukup atau pengguna memberi URL. Mengembalikan cuplikan relevan per URL.",
      inputSchema:{type:"object",properties:{urls:{type:"array",items:{type:"string"}},tujuan:{type:"string"}},required:["urls"]},
      async execute(inp){
        const urls = (Array.isArray(inp.urls)?inp.urls:[inp.urls]).map(String).filter(u=>/^https?:\/\//.test(u)).slice(0,5);
        if (!urls.length) throw new Error("URL tidak valid.");
        const s = step("Membaca: " + urls.map(u=>{try{return new URL(u).hostname}catch{return u}}).join(", "));
        const p = await call("web_fetch", {urls, objective:String(inp.tujuan||"Isi utama halaman").slice(0,200), session_id:webSession});
        s.done = true; updateLast(); return slim(p, 3500);
      }}
  ];
}

        m.proposals.push({text:t}); updateLast();
        return "Diusulkan ke pengguna; tersimpan hanya bila ia menyetujui. Jangan ulangi di jawaban.";

      inputSchema:{type:"object",properties:{kata_kunci:{type:"string"}},required:["kata_kunci"]},
      execute(inp){
        const words = String(inp.kata_kunci||"").toLowerCase().split(/\s+/).filter(w=>w.length>1);
        if (!words.length) throw new Error("Kata kunci kosong.");
        const s = {t:"Membuka arsip: "+words.join(" "), done:false}; m.scan.push(s); updateLast();
        const hits = [];
        for (const c of S.convs){
          if (c.id === S.convId) continue;
          for (const msg of (c.messages||[])){
            const low = (msg.text||"").toLowerCase();
            const score = words.filter(w=>low.includes(w)).length;
            if (score){
              const at = Math.max(0, low.indexOf(words.find(w=>low.includes(w))) - 120);
              hits.push({score, judul:c.title, tanggal:new Date(c.updated||c.created).toISOString().slice(0,10), dari:msg.role==="user"?"pengguna":"DS-07", cuplikan:msg.text.slice(at, at+420)});
            }
          }
        }
        s.done = true; updateLast();
        hits.sort((a,b)=>b.score-a.score);
        return hits.length ? hits.slice(0,6).map(({score,...h})=>h) : "Tidak ada yang cocok di arsip.";
      }}
  ];
}

/* ===================== MENYUSUN PROMPT ===================== */
function userContent(m, full){
  let t = m.text || "";
  if (m.attText?.length){
    if (full) t += m.attText.map(a => `\n\n[Lampiran: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``).join("");
    else t += `\n\n[Lampiran sebelumnya: ${m.attText.map(a=>a.name).join(", ")} — isinya sudah dibahas di atas]`;
  }
  if (m.imgNames?.length) t += `\n\n[${full?"Gambar terlampir":"Gambar sebelumnya"}: ${m.imgNames.join(", ")}]`;
  return t;
}
function buildMessages(){
  const msgs = S.cur.messages.filter(m => !(m.role === "assistant" && !m.done));
  const conv = [];
  const lastUserIdx = msgs.map(m=>m.role).lastIndexOf("user");
  msgs.forEach((m, i) => {
    if (m.role === "user") conv.push({role:"user", content:userContent(m, i >= lastUserIdx - 4)});
    else if (m.text) conv.push({role:"assistant", content:m.text + (m.error ? "\n[jawaban terputus]" : "")});
  });
  // gabungkan peran berurutan yang sama (mis. setelah jawaban gagal kosong)
  const merged = [];
  for (const m of conv){ const p = merged[merged.length-1]; if (p && p.role === m.role) p.content += "\n\n" + m.content; else merged.push({...m}); }
  while (merged.length && merged[0].role !== "user") merged.shift();
  const sys = personaPrompt();
  const max = (S.limits?.maxPromptBytes || 400000) * 0.85;
  let out;
  for (;;){
    out = merged.map((m,i) => i === 0 ? {...m, content: sys + "\n\n" + m.content} : m);
    if (bytes(JSON.stringify(out)) < max || merged.length <= 1) break;
    merged.splice(0, 2);
    while (merged.length && merged[0].role !== "user") merged.shift();
  }
  if (bytes(JSON.stringify(out)) >= max){
    const last = out[out.length-1];
    last.content = last.content.slice(0, Math.floor(max*0.7)) + "\n[… lampiran dipotong karena terlalu panjang]";
  }
  return out;
}

const MODE_LABEL = {quick:"SENYAP", default:"NORMAL", ovf:"OVERFLOW"};
async function send(){
  if (S.busy) return;
  const text = $("#inp").value.trim();
  if (!text && !S.pending.length) return;
  if (!S.sample){ toast(S.aiChecked ? "Inti AI belum aktif. Buka DS-07 di claude.ai dan izinkan akses Claude." : "Menyambung inti AI…"); return; }
  if (!S.cur){ S.cur = {id:uid(), title:"", created:Date.now(), updated:Date.now(), messages:[]}; S.convId = S.cur.id; }
  const imgs = S.pending.filter(p=>p.kind==="img"), txts = S.pending.filter(p=>p.kind==="txt");
  const um = {role:"user", text: text || "(lihat lampiran)", at:Date.now(),
    files:S.pending.map(p=>p.name),
    attText: txts.map(t => ({name:t.name, text:t.text.slice(0, 60000)})),
    imgNames: imgs.map(i=>i.name)};
  if (!S.cur.title) S.cur.title = (text || S.pending[0]?.name || "Percakapan").replace(/\s+/g," ").slice(0, 60);
  S.cur.messages.push(um);
  const blobs = imgs.map(i=>i.blob);
  S.pending.forEach(p => p.url && setTimeout(()=>URL.revokeObjectURL(p.url), 30000));
  S.pending = []; renderPending();
  $("#inp").value = ""; autoGrow();
  if (/terima ?kasih|makasih|thanks|thank you/i.test(text)) flash("pink");
  await run(blobs);
}
async function retry(i){
  if (S.busy) return;
  S.cur.messages.splice(i, 1);
  renderLog(); await run([]);
}
async function run(images){
  const m = {role:"assistant", text:"", at:Date.now(), mode:S.mode, modeLabel:MODE_LABEL[S.mode], scan:[], sources:[], proposals:[], done:false};
  const conv = S.cur; S.liveConv = conv;
  conv.messages.push(m);
  S.busy = true; S.localDirty = true; setBusyUi(true);
  setStatus(S.mode === "ovf" ? "Overflow · menalar" : "Memproses", true);
  renderLog(); renderSide();
  const ctl = new AbortController(); S.ctl = ctl;
  const tools = S.limits?.tools ? [...(S.webOn && S.mcp ? webTools(m) : []), ...opsTools(m), ...coreTools(m)].slice(0, S.limits.tools.maxCount || 8) : undefined;
  const opts = {
    signal: ctl.signal, cache:false,
    modelTier: S.mode === "ovf" ? "complex" : S.mode === "quick" ? "quick" : "default",
    onText: ({text}) => { m.text = text; updateLast(); },
  };
  if (tools?.length) opts.tools = tools;
  if (images.length) opts.images = images;
  try{
    const r = await S.sample(buildMessages(), opts);
    m.text = r.text;
    if (r.truncated) m.text += "\n\n_(Jawaban terpotong karena batas panjang — minta “lanjutkan”.)_";
    document.body.classList.add("blink"); setTimeout(() => document.body.classList.remove("blink"), 300);
  }catch(e){
    m.text = e?.text || m.text || "";
    m.error = sampleError(e);
  }finally{
    m.done = true; m.scan.forEach(s=>s.done = true);
    S.busy = false; S.ctl = null; setBusyUi(false); setStatus("Siaga", false);
    S.liveConv = null;
    if (S.cur === conv) renderLog();
    await Store.saveConv(conv);
    S.localDirty = false;
    if (S.voiceOn && m.text && !m.error) speak(m.text);
  }
}
function sampleError(e){
  const c = e?.code;
  if (c === "cancelled") return "Dihentikan.";
  if (c === "not_granted") return "Akses ke Claude belum diizinkan. Izinkan dari menu izin artifact, lalu coba lagi.";
  if (c === "rate_limited") return e.reason === "usage_limit" ? "Batas pemakaian akun claude.ai tercapai. Coba lagi nanti atau pakai mode Senyap." : "Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.";
  if (c === "prompt_too_large") return "Percakapan atau lampiran terlalu panjang. Mulai percakapan baru atau kirim file yang lebih kecil.";
  if (c === "image_rejected" || c === "images_unavailable") return "Gambar tidak bisa diproses. Coba format PNG/JPG yang lebih kecil.";
  if (c === "refused") return "Permintaan ini tidak bisa saya jawab.";
  if (c === "session_expired") return "Sesi kedaluwarsa. Muat ulang halaman.";
  return "Sambungan ke inti AI terputus" + (c ? ` (${c})` : "") + ". Coba lagi.";
}

async function speak(text){
  if (!S.tts) return;
  const t = plain(text);
  const lines = []; let cur = "";
  for (const para of t.split("\n")){
    if ((cur + "\n" + para).length > 1800){ if (cur) lines.push(cur); cur = para.slice(0, 1800); }
    else cur = cur ? cur + "\n" + para : para;
    if (lines.length >= 4) break;
  }
  if (cur && lines.length < 5) lines.push(cur);
  try{ await S.tts.speak(lines.filter(Boolean).map(x => ({text:x}))); }
  catch(e){ if (e?.code === "not_granted"){ S.tts = null; syncToggles(); } else if (e?.code !== "busy" && e?.reason !== "viewer_stopped") toast("Suara tidak bisa diputar sekarang."); }
}
async function saveFile(text){
  if (!S.dl) return;
  const name = "DS-07_" + (S.cur?.title || "jawaban").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,40) + ".md";
  try{ await S.dl.save({filename:name, data:new Blob([text],{type:"text/markdown"})}); }
  catch(e){ if (e?.code !== "declined" && e?.code !== "cancelled") toast("File tidak tersimpan."); }
}
function setupDictation(){
  if (!S.dict) return;
  const mic = $("#micBtn"); mic.hidden = false;
  let base = "";
  S.dict.onPartial(({text}) => { inp.value = base + text; autoGrow(); });
  S.dict.onFinal(({text}) => { base = (base + text + " "); inp.value = base; autoGrow(); });
  S.dict.onState(({state, reason}) => {
    const on = state === "listening" || state === "starting";
    mic.setAttribute("aria-pressed", String(on));
    if (state === "idle" && reason && /unavailable|unsupported|not_available/i.test(reason)) mic.hidden = true;
  });
  mic.onclick = () => {
    if (S.dict.active()){ S.dict.stop().catch(()=>{}); return; }
    base = inp.value ? inp.value.trimEnd() + " " : "";
    S.dict.start().catch(e => {
      if (e?.code === "not_granted"){ mic.hidden = true; toast("Mikrofon tidak diizinkan — tetap bisa mengetik."); }
      else if (e?.code !== "dismissed") toast("Dikte tidak tersedia di sini.");
    });
  };
}

/* ===================== LACI (HP) ===================== */
function closeSide(){ $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); }
$("#menuBtn").onclick = () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(o)); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSide(); });
$("#main").addEventListener("click", e => { if ($("#side").classList.contains("open") && !e.target.closest("#menuBtn")) closeSide(); });

/* ===================== HUJAN ===================== */
function rain(){
  const c = $("#rain"); const x = c.getContext("2d"); let W, H, drops = [];
  const size = () => { const d = Math.min(devicePixelRatio||1, 2); W = c.width = innerWidth*d; H = c.height = innerHeight*d; c.style.width = innerWidth+"px"; c.style.height = innerHeight+"px";
    const n = Math.round(Math.min(90, innerWidth/16)); drops = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, l:(8+Math.random()*22)*d, v:(4+Math.random()*7)*d, a:.06+Math.random()*.18, r:Math.random()<.18})); };
  size(); addEventListener("resize", size);
  const draw = () => {
    x.clearRect(0,0,W,H);
    for (const p of drops){
      x.strokeStyle = p.r ? `rgba(255,59,79,${p.a*1.4})` : `rgba(201,206,214,${p.a})`;
      x.lineWidth = p.r ? 1.2 : 1; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x - p.l*.12, p.y + p.l); x.stroke();
      if (!reduced){ p.y += p.v; p.x -= p.v*.12; if (p.y > H){ p.y = -p.l; p.x = Math.random()*W*1.1; } }
    }
    if (!reduced && !document.hidden) requestAnimationFrame(draw);
  };
  draw();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduced) requestAnimationFrame(draw); });
}

/* ===================== BOOT ===================== */
async function boot(){
  const b = $("#boot");
  if (reduced){ b.remove(); return; }
  const tx = $("#bootTx");
  const lines = ["DS-07 // MEMBANGUN ULANG KESADARAN", "INGATAN: TERHUBUNG", "SAYA KEMBALI."];
  let skip = false; b.addEventListener("click", () => skip = true, {once:true});
  for (const l of lines){ if (skip) break; tx.textContent = l; await sleep(380); }
  b.classList.add("out"); setTimeout(() => b.remove(), 500);
}

/* ===================== START ===================== */
const use = name => {
  if (!window.claude?.use) return Promise.resolve(null);
  return Promise.race([window.claude.use(name).catch(()=>null), sleep(12000).then(()=>null)]);
};
async function init(){
  applyMode(); syncToggles(); S.convsLoading = true; renderSide(); renderLog(); rain(); boot();
  const [sample, db, user, tts, dict, mcp, dl] = await Promise.all(["sample","db","user","tts","dictation","mcp","downloads"].map(use));
  Object.assign(S, {sample, db, user, tts, dict, mcp, dl, aiChecked:true});
  if (sample){ try{ S.limits = await sample.limits(); }catch{ S.limits = null; } }
  if (db && user){ try{ S.uid = await user.id(); }catch{} try{ S.isOwner = !!(await user.isOwner()); }catch{} }
  S.storage = db && S.uid ? "db" : "local";
  syncToggles(); setupDictation(); Store.start(); Ops.start(); renderLog(); renderSide();
  if (!sample) setStatus("AI tidak aktif", false);
}
init();
</script>
