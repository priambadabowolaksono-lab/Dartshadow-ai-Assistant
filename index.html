<title>DS-07</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: HUD satu layar — panel arsip di kiri, kanal komunikasi DS-07 di kanan; laci di HP.
   Satu dunia visual gelap (Neo Tokyo, hujan merah) — sengaja tidak punya tema terang. */
:root{
  color-scheme:dark;
  --void:#07080b;        /* latar: hitam kebiruan */
  --panel:#0d0f14;       /* permukaan panel */
  --panel-2:#13161d;     /* permukaan terangkat */
  --line:#242833;        /* garis tipis (dekoratif) */
  --line-field:#5c6270;  /* tepi kolom input: kontras 3:1 */
  --silver:#c9ced6;      /* aksen perak (bracer) */
  --fg:#e9e7e4;          /* teks utama */
  --muted:#8b909b;       /* teks sekunder */
  --red:#ff3b4f;         /* mata DS — senjata, normal */
  --red-deep:#9e1626;    /* retakan merah */
  --amber:#f0a44a;       /* Kai — ingatan, arsip */
  --gold:#ffd76a;        /* pilihan — hal yang disimpan */
  --pink:#ffb3c8;        /* Lira — momen hangat */
  --steel:#9fb0c4;       /* Design Ops — sistem luar (ungu di lore, baja di UI) */
  --green:#5fd49a;       /* Eira — status sehat */
  --eye:var(--red);
  --f-disp:"Oxanium","Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-s:4px;             /* chip, kode sebaris */
  --r:6px;               /* kontrol: tombol, field */
  --r-c:8px;             /* kartu */
  --r-l:12px;            /* dialog, komposer */
  /* gerak: satu kurva UI, satu kurva masuk, tanpa pantulan */
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-enter:cubic-bezier(.22,1,.36,1);
  --m-in:150ms; --m-out:120ms; --m-press:90ms;
}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font:15px/1.6 var(--f-body);overflow:hidden}
::selection{background:var(--red-deep);color:#fff}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;transition:none}
a{color:var(--silver)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));padding:10px 14px;border-radius:var(--r);background:var(--red);color:#120306;font-weight:600;text-decoration:none;transform:translateY(-160%)}
.skip:focus{transform:none}
button,a,input,select,textarea{touch-action:manipulation}
.ferr{font:12px/1.4 var(--f-body);color:#ff8a96}
.opsf [aria-invalid="true"]{border-color:var(--red)}

#rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.app{position:relative;z-index:1;display:grid;grid-template-columns:288px minmax(0,1fr);height:100%}

/* ---------- panel samping ---------- */
.side{display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--panel) 92%,transparent);border-right:1px solid var(--line);
  padding-block:16px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand b{font:700 18px/1 var(--f-disp);letter-spacing:.12em}
.brand small{display:block;font:500 11px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font-weight:500}
.btn:hover{border-color:#3a3f4c}
.btn.red{border-color:var(--red-deep);background:linear-gradient(180deg,#2a0d12,#1a0a0e);color:#ffd9de}
.btn.red:hover{border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 0 10px;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:var(--void)}
.tabs button{min-height:34px;border:0;border-radius:4px;background:transparent;color:var(--muted);font:600 12px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--fg)}
.tabs button[data-k="mem"][aria-selected="true"]{color:var(--amber)}
.tabs button[data-k="ops"][aria-selected="true"]{color:var(--steel)}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-right:-6px;padding-right:6px}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;border-radius:var(--r);padding:8px 8px 8px 10px;border:1px solid transparent}
.conv:hover{background:var(--panel-2)}
.conv[aria-current="true"]{background:var(--panel-2);border-color:var(--line);box-shadow:inset 2px 0 0 var(--red)}
.conv button.open{all:unset;cursor:pointer;min-width:0;display:block;border-radius:4px}
.conv button.open:focus-visible,.chip button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.conv .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.conv .d{display:block;font:11px/1.4 var(--f-mono);color:var(--muted)}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--line);background:var(--panel-2)}
.iconbtn svg{width:16px;height:16px}
.conv .iconbtn{opacity:0}
.conv:hover .iconbtn,.conv:focus-within .iconbtn{opacity:1}
.empty-note{color:var(--muted);font-size:13px;padding:10px 4px;line-height:1.5}
.ops-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px;font:600 11px/1 var(--f-disp);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.rep{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--r-c);border:1px solid var(--line);background:var(--panel-2);margin-bottom:10px}
.rep b{font:600 13px/1.3 var(--f-disp);letter-spacing:.06em}
.rep p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 8px 7px 10px;border-radius:var(--r)}
.req:hover{background:var(--panel-2)}
.req .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.ok{color:var(--green);border-color:#1f4d36}.st.run{color:var(--amber);border-color:#4a3418}.st.bad{color:var(--red);border-color:var(--red-deep)}
.opsf{margin-top:12px;border:1px solid #2b3140;border-left:2px solid var(--steel);border-radius:var(--r-c);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:10px}
.opsf .lbl{font:600 11px/1 var(--f-disp);letter-spacing:.16em;color:var(--steel);text-transform:uppercase}
.opsf .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opsf label{display:flex;flex-direction:column;gap:4px;font:11px/1.3 var(--f-mono);color:var(--muted);min-width:0}
.opsf label.w{grid-column:1/-1}
.opsf input,.opsf select{min-height:36px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line-field);background:var(--void);color:var(--fg);font:14px var(--f-body);min-width:0;width:100%;box-sizing:border-box}
.opsf .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opsf .res{font-size:13px}
@media (max-width:520px){.opsf .g{grid-template-columns:minmax(0,1fr)}}
.memadd{display:flex;gap:6px;margin-bottom:8px}
.memadd input{flex:1;min-width:0;min-height:36px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line-field);background:var(--void)}
.frag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start;padding:8px 8px 8px 10px;border-radius:var(--r-c);border:1px solid #3a2a14;background:linear-gradient(180deg,#17120b,#110e0a)}
.frag p{margin:0;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.frag .d{font:11px/1.4 var(--f-mono);color:#b98a4c;letter-spacing:.06em}
.foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font:11px/1.5 var(--f-mono);color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.warn{background:var(--amber)}
.dot.off{background:#4a4f5a}
.acct{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px;color:var(--fg)}
.acct b{font-weight:500}
.acct .btn{min-height:28px;padding:0 8px;font:500 11px var(--f-mono)}
.guide{margin:0 0 14px;padding-left:1.3em;color:var(--fg);font-size:14px;display:flex;flex-direction:column;gap:6px}
.linkbox{display:flex;gap:6px;margin:0 0 14px}
.linkbox input{flex:1;min-width:0;min-height:36px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line-field);background:var(--void);color:var(--fg);font:12px var(--f-mono)}

/* ---------- kanal utama ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--void) 80%,transparent);backdrop-filter:blur(6px)}
.menu{display:none}
.ident{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.ident h1{margin:0;font:700 20px/1 var(--f-disp);letter-spacing:.14em}
.status{font:500 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.status b{color:var(--eye);font-weight:500}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:var(--void)}
.seg button{border:0;background:transparent;color:var(--muted);min-height:32px;padding:0 12px;border-radius:4px;font:600 12px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.seg button[data-m="ovf"][aria-pressed="true"]{background:#2a0d12;color:var(--red);box-shadow:0 0 14px #ff3b4f33}
.toggles{display:flex;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--muted);font:500 12px/1 var(--f-mono)}
.tg[aria-pressed="true"]{color:var(--fg);border-color:#3a3f4c;background:var(--panel-2)}
.tg[aria-pressed="true"] .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.tg svg{width:14px;height:14px}

/* avatar: kepala bulat hitam tanpa wajah, dua mata menyapu */
.ava{flex:none;display:block}
.ava .head{stroke:#2c3039;stroke-width:1.2}
.ava .eye{fill:var(--eye);filter:drop-shadow(0 0 3px var(--eye)) drop-shadow(0 0 8px var(--eye));transition:fill .5s}
.ava .crack{stroke:var(--red);stroke-width:1;fill:none;opacity:0;transition:opacity .4s}
.think .ava .eye{animation:pulse 1.1s ease-in-out infinite}
.ovf .ava .crack{opacity:.8}
.ovf{--eye:#ff2a40}
.flash-gold{--eye:var(--gold)}
.flash-pink{--eye:var(--pink)}
.blink .ava .eyes{animation:blink .22s ease-in-out 1}
.ava .eyes{transform-origin:50% 52%;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{transform:scaleY(.1)}}

.log{flex:1;min-height:0;overflow-y:auto}
.log-in{max-width:820px;margin:0 auto;padding-block:24px 32px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.msg .who{font:600 11px/1 var(--f-disp);letter-spacing:.14em;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.msg.u .who{color:var(--silver)}
.msg .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-top:-4px}
.msg.u .mk{border:1px solid var(--line);background:var(--panel-2);color:var(--silver)}
.msg.u .mk svg{width:14px;height:14px}
.msg.u .body{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-c);padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--void);font:11px/1.5 var(--f-mono);color:var(--muted)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.chip img{width:22px;height:22px;object-fit:cover;border-radius:3px}
.chip button{all:unset;cursor:pointer;color:var(--muted);padding:0 2px}
.chip button:hover{color:var(--red)}

/* jawaban DS-07 */
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .75em}
.md h2,.md h3,.md h4{font-family:var(--f-disp);letter-spacing:.04em;margin:1.1em 0 .4em;line-height:1.25;text-wrap:balance}
.md h2{font-size:19px}.md h3{font-size:17px}.md h4{font-size:15px;color:var(--silver)}
.md ul,.md ol{margin:0 0 .75em;padding-left:1.4em}
.md li{margin:.15em 0}
.md li::marker{color:var(--red)}
.md code{font:13px/1.5 var(--f-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.md pre{position:relative;margin:0 0 .9em;background:#0a0b0f;border:1px solid var(--line);border-left:2px solid var(--red-deep);border-radius:var(--r-c);overflow:auto}
.md pre code{display:block;padding:12px 14px;border:0;background:none;white-space:pre;font-size:13px}
.md pre .cp{position:absolute;top:6px;right:6px;color:var(--muted)}
.md pre .cp svg{width:14px;height:14px}
.md blockquote{margin:0 0 .8em;padding:2px 0 2px 14px;border-left:2px solid var(--amber);color:#d9cbb6}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md .tw{overflow-x:auto;margin:0 0 .9em}
.md table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel-2);font-weight:600}
.md a{color:#ffc2c9;text-decoration-color:#ff3b4f66}
.md strong{color:#fff}

.scan{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font:12px/1.5 var(--f-mono);color:var(--muted)}
.scan div::before{content:"▸ ";color:var(--red)}
.scan div.done::before{content:"✓ ";color:var(--green)}
.thinking{font:12px/1.5 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.thinking::after{content:"";display:inline-block;width:8px;height:12px;margin-left:6px;background:var(--eye);vertical-align:-1px;animation:pulse .9s steps(2) infinite}
.err{border:1px solid var(--red-deep);background:#1a0a0e;border-radius:var(--r-c);padding:10px 12px;color:#ffd0d6;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tools .btn{min-height:30px;padding:0 9px;font-size:12px;color:var(--muted);background:transparent}
.tools .btn:hover{color:var(--fg)}
.tools .btn svg{width:14px;height:14px}
.src{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.src h5{margin:0 0 6px;font:600 11px/1 var(--f-disp);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.src ol{margin:0;padding-left:1.3em;font-size:13px}
.src li{margin:2px 0;overflow-wrap:anywhere}
.src a{color:var(--silver)}
.prop{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.prop .frag{grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.prop .lbl{font:600 11px/1 var(--f-disp);letter-spacing:.16em;color:var(--amber);text-transform:uppercase}

/* layar kosong */
.hello{margin:auto 0;padding-top:8vh;display:flex;flex-direction:column;gap:18px}
.hello .eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.2em;color:var(--red)}
.hello h2{margin:0;font:700 clamp(28px,5vw,44px)/1.05 var(--f-disp);letter-spacing:.04em;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:56ch}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.sugg button{text-align:left;padding:12px 14px;border-radius:var(--r-c);border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--fg);line-height:1.45}

.sugg small{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.notice{border:1px solid #3a2a14;background:#15100a;color:#e8cfa8;border-radius:var(--r-c);padding:10px 12px;font-size:13px}

/* komposer */
.comp{padding-block:10px 14px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:color-mix(in srgb,var(--void) 88%,transparent)}
.comp-in{max-width:820px;margin:0 auto}
.box{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:end;gap:6px;border:1px solid var(--line-field);border-radius:var(--r-l);background:var(--panel);padding:6px;transition:border-color 140ms var(--ease),box-shadow 140ms var(--ease)}
.box:focus-within{border-color:var(--red-deep);box-shadow:0 0 0 3px #ff3b4f1f}
.ovf .box{border-color:var(--red-deep);box-shadow:0 0 0 1px #ff3b4f22,0 0 24px #ff3b4f1a}
.box textarea{box-sizing:border-box;resize:none;border:0;background:transparent;outline:none;height:40px;min-height:40px;max-height:200px;padding:9px 6px;line-height:1.5;overflow-x:hidden}
.box textarea::placeholder{color:#7d828d}
.send{width:40px;height:40px;border-radius:8px;border:1px solid var(--red-deep);background:linear-gradient(180deg,#3a0f17,#250a10);color:#ffd9de;display:grid;place-items:center}
.send:hover{border-color:var(--red)}
.send svg,.box .iconbtn svg{width:18px;height:18px}
.box .iconbtn{width:40px;height:40px}
.mic[aria-pressed="true"]{color:var(--red);border-color:var(--red-deep);animation:pulse 1.2s infinite}
.hint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;font:11px/1.4 var(--f-mono);color:var(--muted)}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.gptbtn{font:600 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--steel)}
.gptbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;padding:8px 10px;border:1px solid #33404f;border-left:2px solid var(--steel);border-radius:var(--r-c);background:var(--panel);font-size:13px}
.gptbar span{flex:1;min-width:180px;color:var(--fg)}
.msg.g .mk{border:1px solid #33404f;background:#101720;color:var(--steel);font:600 9px/1 var(--f-mono);letter-spacing:.04em}
.msg.g .who{color:var(--steel)}
.msg.g .md{border-left:2px solid #33404f;padding-left:12px}
.gdlg textarea{width:100%;box-sizing:border-box;min-height:160px;max-height:46vh;resize:vertical;padding:10px;border-radius:var(--r);border:1px solid var(--line-field);background:var(--void);color:var(--fg);font:13px/1.5 var(--f-mono);margin:0 0 12px}
.gdlg textarea:focus{outline:none;border-color:var(--red-deep);box-shadow:0 0 0 3px #ff3b4f1f}
.gdlg label.opt{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;color:var(--fg)}

function trapFocus(dlg){
  // Tab dan Shift+Tab berputar di dalam dialog
  dlg.addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    const f = [...dlg.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
      .filter(x => !x.matches(":disabled") && !x.closest("[hidden]") && x.getClientRects().length > 0 && getComputedStyle(x).visibility === "visible");
    if (!f.length) return;
    const first = f[0], last = f[f.length-1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
}

function inlineMd(s){
  let t = esc(s);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_,c) => { codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_,a,u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${a}</a>`);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_,p,u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return t.replace(/\u0000(\d+)\u0000/g, (_,i) => `<code>${codes[+i]}</code>`);
}
function md(src){
  const out = []; const lines = String(src).replace(/\r/g,"").split("\n");
  let i = 0, para = [];
  const flush = () => { if (para.length){ out.push("<p>"+para.map(inlineMd).join("<br>")+"</p>"); para = []; } };
  while (i < lines.length){
    const l = lines[i];
    const fence = l.match(/^\s*```\s*([\w+-]*)/);
    if (fence){
      flush(); const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><button class="btn sm ghost cp" type="button" data-copy>${IC.copy}<span class="sr">Salin kode</span></button><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    if (/^\s*$/.test(l)){ flush(); i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h){ flush(); const n = Math.min(4, h[1].length+1); out.push(`<h${n}>${inlineMd(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ flush(); out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i+1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      out.push(`<div class="tw"><table><thead><tr>${head.map(c=>`<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*>/.test(l)){
      flush(); const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue;
    }
    const li = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)/);
    if (li){
      flush(); const ordered = /\d/.test(li[1]); const items = [];
      while (i < lines.length){
        const m = lines[i].match(/^\s*([-*+]|\d+[.)])\s+(.*)/);
        if (m && /\d/.test(m[1]) === ordered) { items.push(m[2]); i++; }
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length-1] += " " + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map(x=>`<li>${inlineMd(x)}</li>`).join("")}</${tag}>`); continue;
    }
    para.push(l); i++;
  }
  flush();
  return out.join("");
}

      const timer = setTimeout(()=>{ if (!gotC) { S.convsLoading = false; renderSide(); } }, 10000);
      this.unsubs.push(this.convCol().orderBy("updated","desc").limit(60).onSnapshot(snap=>{
        gotC = true; clearTimeout(timer); S.convsLoading = false;
        S.convs = snap.docs.map(d => ({id:d.id, ...d.data()}));
        const cur = S.convs.find(c => c.id === S.convId);
        if (cur && !S.busy && !S.localDirty && (cur.messages||[]).length !== (S.cur?.messages||[]).length){ S.cur = structuredClone(cur); renderLog(); }
        renderSide();
      }, e => { S.convsLoading = false; renderSide(); toast("Arsip tidak bisa dimuat: "+(e.message||e.code)); }));
      this.unsubs.push(this.memCol().orderBy("created","asc").limit(200).onSnapshot(snap=>{
        gotM = true; S.mems = snap.docs.map(d => ({id:d.id, ...d.data()})); renderSide();
      }, e => toast("Ingatan tidak bisa dimuat: "+(e.message||e.code))));
    } else {
      S.convs = lsGet("ds07.convs", []); S.mems = lsGet("ds07.mems", []); S.convsLoading = false; renderSide();
    }
  },
  async saveConv(c){
    c.updated = Date.now();
    // satu dokumen maksimal 256 KiB: buang pesan tertua bila perlu
    while (bytes(JSON.stringify(c)) > 230000 && c.messages.length > 2) { c.messages.splice(0, 2); c.trimmed = true; }
    if (S.storage === "db"){
      try{ await this.convCol().doc(c.id).set(JSON.parse(JSON.stringify(c))); }
      catch(e){ toast(e.code === "quota_exceeded" ? "Penyimpanan penuh — hapus beberapa percakapan lama." : "Gagal menyimpan percakapan."); }
    } else {
      const i = S.convs.findIndex(x => x.id === c.id);
      if (i >= 0) S.convs[i] = structuredClone(c); else S.convs.unshift(structuredClone(c));
      S.convs.sort((a,b)=>b.updated-a.updated); lsSet("ds07.convs", S.convs.slice(0,40)); renderSide();
    }
  },
  async delConv(id){
    if (S.storage === "db"){ try{ await this.convCol().doc(id).delete(); }catch{ toast("Gagal menghapus."); } }
    else { S.convs = S.convs.filter(c => c.id !== id); lsSet("ds07.convs", S.convs); renderSide(); }
  },
  async addMem(text){
    const m = {text:String(text).slice(0,400), created:Date.now()};
    if (S.storage === "db"){ try{ await this.memCol().add(m); }catch(e){ toast("Gagal menyimpan ingatan."); return false; } }
    else { S.mems.push({id:uid(), ...m}); lsSet("ds07.mems", S.mems); renderSide(); }
    return true;
  },
  async delMem(id){
    if (S.storage === "db"){ try{ await this.memCol().doc(id).delete(); }catch{ toast("Gagal menghapus ingatan."); } }
    else { S.mems = S.mems.filter(m => m.id !== id); lsSet("ds07.mems", S.mems); renderSide(); }
  }
};

function msgHtml(m, i){
  if (m.role === "user"){

  }
  if (extOfMsg(m)) return `<article class="msg g" data-i="${i}"><div class="mk" aria-hidden="true">${EXT[m.src].tag}</div>
    <div style="min-width:0"><div class="who">${EXT[m.src].name.toUpperCase()} <span style="color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em">DITEMPEL DARI AKUNMU</span></div>${aBody(m,i)}</div></article>`;
  return `<article class="msg a" data-i="${i}"><div class="mk" aria-hidden="true"><svg class="ava" width="28" height="28" viewBox="0 0 100 100">${AVA}</svg></div>
    <div style="min-width:0"><div class="who">DS-07${m.modeLabel?` <span style="color:${m.mode==="ovf"?"var(--red)":"var(--muted)"};font-family:var(--f-mono);letter-spacing:.06em">${esc(m.modeLabel)}</span>`:""}</div>${aBody(m,i)}</div></article>`;

function aBody(m, i){
  const scan = (m.scan||[]).length ? `<div class="scan">${m.scan.map(s=>`<div class="${s.done?"done":""}">${esc(s.t)}</div>`).join("")}</div>` : "";
  const body = m.error ? `${m.text?`<div class="md">${md(m.text)}</div>`:""}<div class="err" role="alert">${esc(m.error)}</div>`
    : m.text ? `<div class="md">${md(m.text)}</div>` : `<div class="thinking">${m.mode==="ovf"?"OVERFLOW · MENALAR DALAM":"MEMPROSES"}</div>`;
  const src = (m.sources||[]).length ? `<div class="src"><h5>Sumber yang dipindai</h5><ol>${m.sources.slice(0,8).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a></li>`).join("")}</ol></div>` : "";
  const prop = (m.proposals||[]).filter(p=>!p.done).length ? `<div class="prop"><span class="lbl">DS-07 ingin mengingat</span>${m.proposals.map((p,k)=>p.done?"":`<div class="frag"><p>${esc(p.text)}</p><button class="btn sm" type="button" data-keep="${i}:${k}">Simpan</button><button class="btn sm ghost" type="button" data-skip="${i}:${k}">Abaikan</button></div>`).join("")}</div>` : "";
  const tools = m.done && m.text ? `<div class="tools">
      <button class="btn" type="button" data-act="copy" data-i="${i}">${IC.copy}Salin</button>
      ${S.tts?`<button class="btn" type="button" data-act="speak" data-i="${i}">${IC.speak}Bacakan</button>`:""}
      ${S.dl?`<button class="btn" type="button" data-act="dl" data-i="${i}">${IC.down}Unduh .md</button>`:""}
      ${extOfMsg(m) ? `<button class="btn" type="button" data-act="compare" data-i="${i}">Bandingkan dengan DS-07</button>`
        : `<button class="btn" type="button" data-act="gpt-ask" data-i="${i}">Tanya AI lain</button>`}
      ${extOfMsg(m) ? "" : m.error?`<button class="btn" type="button" data-act="retry" data-i="${i}">${IC.retry}Coba lagi</button>`
        : (i === (S.cur?.messages.length||0) - 1 && !S.busy ? `<button class="btn" type="button" data-act="retry" data-i="${i}">${IC.retry}Ulangi jawaban</button>` : "")}
      ${m.usage?`<button class="btn" type="button" data-act="acct" data-i="${i}">Ganti akun</button>`:""}
    </div>` : (m.done && m.error ? `<div class="tools"><button class="btn" type="button" data-act="retry" data-i="${i}">${IC.retry}Coba lagi</button>${m.usage?`<button class="btn" type="button" data-act="acct" data-i="${i}">Ganti akun</button>`:""}</div>` : "");
  const ops = (m.opsDrafts||[]).map((d,k) => opsForm(d, i, k)).join("");
  return scan + body + ops + src + prop + tools;
}
let rafPending = false, lastPaint = 0;
function updateLast(){
  if (rafPending) return; rafPending = true;
  const wait = Math.max(0, 60 - (performance.now() - lastPaint));
  setTimeout(() => requestAnimationFrame(() => {
    rafPending = false; lastPaint = performance.now();
    if (S.cur !== S.liveConv) return;
    const msgs = S.cur?.messages || []; const i = msgs.length-1; const m = msgs[i];
    const el = document.querySelector(`.msg[data-i="${i}"]`);
    if (!el || !m) { renderLog(); return; }
    const host = el.querySelector(".mk + div");
    host.innerHTML = `<div class="who">${el.querySelector(".who")?.innerHTML||"DS-07"}</div>` + aBody(m,i);
    scrollEnd();
  }), wait);
}
function scrollEnd(force){
  const L = $("#log");
  const near = L.scrollHeight - L.scrollTop - L.clientHeight < 160;
  if (force || near) L.scrollTop = L.scrollHeight;
}

    p.done = true; await Store.saveConv(S.cur); renderLog(); return;
  }
  const os = e.target.closest("[data-ops-send]"), oc = e.target.closest("[data-ops-cancel]");
  if (os){ os.disabled = true; const [i,k] = os.dataset.opsSend.split(":").map(Number); await sendOps(i,k); return; }
  if (oc){ const [i,k] = oc.dataset.opsCancel.split(":").map(Number); S.cur.messages[i].opsDrafts[k].cancelled = true; await Store.saveConv(S.cur); renderLog(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const m = S.cur.messages[+a.dataset.i];
  if (a.dataset.act === "copy") copyText(m.text, a);

  if (a.dataset.act === "dl") saveFile(m.text);
  if (a.dataset.act === "retry") retry(+a.dataset.i);
  if (a.dataset.act === "acct") accountDialog();
  if (a.dataset.act === "gpt-ask"){
    const q = [...S.cur.messages.slice(0, +a.dataset.i)].reverse().find(x => x.role === "user");
    gptDialog(q?.text || "", +a.dataset.i);
  }
  if (a.dataset.act === "compare"){
    if (S.busy) return;
    inp.value = `Bandingkan jawabanmu dengan jawaban ${EXT[m.src]?.name || "AI lain"} di atas: mana yang lebih tepat, apa bedanya, lalu gabungkan jadi satu jawaban terbaik.`;
    autoGrow(); send();
  }
});

/* ===================== LAMPIRAN ===================== */
const TEXT_EXT = /\.(txt|md|csv|json|html|css|js|ts|py|xml|ya?ml|log|tsv|sql)$/i;
async function addFiles(list){
  for (const f of list){
    if (S.pending.length >= 8){ toast("Maksimal 8 lampiran sekaligus."); break; }
    if (f.type.startsWith("image/")){
      const lim = S.limits?.images;
      if (!lim){ toast("Gambar tidak bisa dikirim ke AI di tampilan ini."); continue; }
      if (lim.mediaTypes && !lim.mediaTypes.includes(f.type)){ toast(`${f.name}: format gambar tidak didukung.`); continue; }
      if (f.size > lim.maxInputBytes){ toast(`${f.name}: gambar terlalu besar.`); continue; }
      if (S.pending.filter(p=>p.kind==="img").length >= lim.maxCount){ toast(`Maksimal ${lim.maxCount} gambar.`); continue; }
      S.pending.push({kind:"img", name:f.name, blob:f, url:URL.createObjectURL(f)});
    } else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)){
      if (f.size > 25 * 1024 * 1024){ toast(`${f.name}: PDF terlalu besar (maks 25 MB).`); continue; }
      const t = await pdfText(f); if (t == null) continue;
      S.pending.push({kind:"txt", name:f.name, text:t});
    } else if (TEXT_EXT.test(f.name) || f.type.startsWith("text/")){
      if (f.size > 2_000_000){ toast(`${f.name}: file terlalu besar (maks 2 MB).`); continue; }
      S.pending.push({kind:"txt", name:f.name, text:await f.text()});
    } else toast(`${f.name}: jenis file belum didukung.`);
  }
  renderPending();
}
const PDF_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLoading;
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
function loadPdf(){
  // pdf.worker dimuat sebagai skrip biasa: pdf.js lalu berjalan di thread utama,
  // karena CSP artifact tidak mengizinkan Worker dari origin lain.
  pdfLoading ||= loadScript(PDF_BASE + "pdf.min.js").then(() => loadScript(PDF_BASE + "pdf.worker.min.js"));
  return pdfLoading;
}
async function pdfText(f){
  toast("Membaca PDF…");
  try{ await loadPdf(); }catch{ pdfLoading = null; toast("Pembaca PDF tidak termuat. Periksa koneksi lalu coba lagi."); return null; }
  const lib = window.pdfjsLib;
  try{
    const doc = await lib.getDocument({data: await f.arrayBuffer(), isEvalSupported:false}).promise;
    let out = ""; const n = Math.min(doc.numPages, 60);
    for (let p = 1; p <= n; p++){
      const pg = await doc.getPage(p); const tc = await pg.getTextContent();
      out += `\n[Hal. ${p}]\n` + tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("");
      if (out.length > 120000) break;
    }
    if (doc.numPages > n) out += `\n[… ${doc.numPages-n} halaman berikutnya tidak dibaca]`;
    if (!out.trim()){ toast(`${f.name}: PDF ini berupa gambar hasil scan — kirim sebagai gambar.`); return null; }
    return out;
  }catch(e){ toast(`${f.name}: PDF tidak bisa dibaca.`); return null; }
}
function renderPending(){
  const P = $("#pend");
  P.hidden = !S.pending.length;

}

$("#file").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
const box = $("#box");

["dragleave","drop"].forEach(t => document.addEventListener(t, e => { if (t === "dragleave" && e.relatedTarget) return; box.classList.remove("drop"); }));

/* ===================== DESIGN OPS (jembatan) ===================== */
// Dua artifact tidak bisa saling membaca database. Jembatannya tugas Claude terjadwal di cloud:
//  - "input": dipicu DS-07 per permintaan; membaca ops/<req_…> lalu menulis project ke Design Ops.
//  - "laporan": tiap pagi (atau saat diminta) membaca Design Ops lalu menulis ops/lap_<tanggal> + ops/katalog.
// Koleksi "ops" hanya bisa dibaca/ditulis pemilik artifact (lihat aturan db saat publish).
const opsReady = () => !!(S.ops.ok && S.ops.config);
const canFire = () => !!(S.mcp && opsReady() && S.isOwner);   // tugas cloud milik akun pemilik
const OPS_ST = {antri:["Antri","run"], diproses:["Diproses","run"], selesai:["Masuk","ok"], gagal:["Gagal","bad"]};
const Ops = {
  start(){
    if (!S.db) { S.ops.ok = false; return; }
    S.db.collection("ops").limit(300).onSnapshot(snap => {
      const docs = snap.docs.map(d => ({id:d.id, ...d.data()}));
      S.ops.config = docs.find(d => d.id === "config") || null;
      S.ops.katalog = docs.find(d => d.id === "katalog") || null;
      S.ops.reqs = docs.filter(d => d.kind === "req").sort((a,b) => (b.at||0) - (a.at||0));
      S.ops.reports = docs.filter(d => d.kind === "laporan").sort((a,b) => String(b.date).localeCompare(String(a.date)));
      S.ops.ok = true; renderSide();
      $("#bfBtn").hidden = !S.ops.reports.length; bfMaybeAuto();
      if (!S.busy && (S.cur?.messages||[]).some(m => (m.opsDrafts||[]).some(d => d.reqId))) renderLog();
    }, () => { S.ops.ok = false; renderSide(); });
  },
  async fire(which, text){
    const id = S.ops.config?.[which === "input" ? "inputTrigger" : "reportTrigger"];
    if (!id) throw new Error("Tugas cloud belum diatur.");
    if (!S.mcp) throw new Error("Konektor Claude Code Remote tidak tersedia di tampilan ini.");
    try { await S.mcp.callTool("Claude Code Remote", "fire_trigger", text ? {trigger_id:id, text} : {trigger_id:id}, {cache:false}); }
    catch(e){ throw new Error(e.code === "not_granted" || e.code === "consent_required" ? "Izin konektor Claude Code Remote belum diberikan." : e.code === "server_not_connected" || e.code === "server_not_found" ? "Konektor Claude Code Remote belum tersambung di akunmu." : "Gagal memicu tugas cloud (" + (e.code || "error") + ")."); }
  }
};

  if (!S.ops.config) return `<div class="empty-note">Jembatan Design Ops belum diatur. Minta Claude menyiapkan tugas cloud “input” dan “laporan”.</div>`;

async function sendOps(i, k){
  const m = S.cur.messages[i], d = m.opsDrafts[k];
  const box = document.querySelector(`[data-of="${i}:${k}"]`);
  box.querySelectorAll("[data-f]").forEach(el => { d.v[el.dataset.f] = el.value.trim(); });
  box.querySelectorAll(".ferr").forEach(x => x.remove());
  box.querySelectorAll("[aria-invalid]").forEach(x => { x.removeAttribute("aria-invalid"); x.removeAttribute("aria-describedby"); });
  const bad = [];
  if (!d.v.nama) bad.push(["nama", "Isi nama project, mis. “Flyer HSSE”."]);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.v.deadline)) bad.push(["deadline", "Pilih tanggal deadline."]);
  if (bad.length){
    bad.forEach(([f, msg]) => {
      const el = box.querySelector(`[data-f="${f}"]`); const id = el.id + "-err";
      el.setAttribute("aria-invalid","true"); el.setAttribute("aria-describedby", id);
      el.insertAdjacentHTML("afterend", `<span class="ferr" id="${id}" role="alert">${esc(msg)}</span>`);
    });
    box.querySelector('[aria-invalid="true"]').focus();
    box.querySelector("[data-ops-send]").disabled = false;
    return;
  }
  const reqId = "req_" + uid();
  const data = {nama:d.v.nama, bu:d.v.bu, pic:d.v.pic, deadline:d.v.deadline, kategori:d.v.kategori, slide:+d.v.slide || 0, prioritas:d.v.prio, catatan:d.v.catatan, tanggal:todayISO()};
  const direct = canFire();
  try{ await S.db.collection("ops").doc(reqId).set({kind:"req", status:"antri", at:Date.now(), data, via:"DS-07", dipicu:direct}); }
  catch(e){ toast("Gagal mencatat permintaan."); return; }
  d.reqId = reqId; await Store.saveConv(S.cur); renderLog();
  if (!direct){ toast("Masuk antrean. Diproses paling lambat 1 jam."); return; }
  try{
    await Ops.fire("input", `REQ_ID=${reqId}`);
    toast("Dikirim. Project akan masuk Design Ops dalam 1–3 menit.");
  }catch(e){
    // pemicu langsung gagal → tetap di antrean; tugas antrean tiap jam yang mengambilnya
    try{ await S.db.collection("ops").doc(reqId).update({dipicu:false}); }catch{}
    toast(e.message + " Project tetap di antrean (diproses tiap jam).");
  }
}

const GPT_URL_MAX = 1800;
const EXT = {
  gpt:{name:"ChatGPT", tag:"GPT", home:"https://chatgpt.com/",
    url:p => { const e = encodeURIComponent(p); return p && e.length <= GPT_URL_MAX ? "https://chatgpt.com/?q=" + e : "https://chatgpt.com/"; },
    fits:p => encodeURIComponent(p).length <= GPT_URL_MAX},
  gemini:{name:"Gemini", tag:"GEM", home:"https://gemini.google.com/app", url:() => "https://gemini.google.com/app", fits:() => false,
    alt:{label:"Buka AI Studio", url:"https://aistudio.google.com/prompts/new_chat"}}
};
const extOfMsg = m => m.src in EXT ? m.src : null;
const extWaiting = () => { const w = S.cur?.gptWaiting; return w === true ? "gpt" : (w in EXT ? w : null); };
function ensureConv(title){
  if (!S.cur){ S.cur = {id:uid(), title:"", created:Date.now(), updated:Date.now(), messages:[]}; S.convId = S.cur.id; }
  if (!S.cur.title && title) S.cur.title = String(title).replace(/\s+/g," ").slice(0, 60);
}
function gptContext(upto){
  const msgs = (S.cur?.messages || []).slice(0, upto ?? undefined).filter(m => m.text && !m.error).slice(-6);
  return msgs.map(m => (m.role === "user" ? "Pengguna: " : extOfMsg(m) ? EXT[m.src].name + ": " : "Asisten: ") + m.text.replace(/\s+/g," ").slice(0, 600)).join("\n");
}
function gptPrompt(q, withCtx, upto){
  const ctx = withCtx ? gptContext(upto) : "";

function webTools(m){
  const step = t => { const s = {t, done:false}; m.scan.push(s); updateLast(); return s; };
  const addSrc = list => { for (const r of list) if (r.url && !m.sources.some(s=>s.url===r.url)) m.sources.push({url:r.url, title:r.title}); };
  const call = async (tool, input) => {
    try{
      const res = await S.mcp.callTool("Parallel Search", tool, input, {cache:false});
      S.webState = "ok"; renderSide();
      return res.payload ?? res.structuredContent ?? (res.content||[]).map(c=>c.text||"").join("\n");
    }catch(e){
      if (["not_granted","server_not_connected","server_not_found","needs_reauth","consent_required","not_in_manifest"].includes(e.code)){
        S.webState = "gagal"; renderSide();
        throw new Error("Pencarian web tidak tersedia: sambungkan konektor Parallel Search di pengaturan claude.ai, lalu izinkan untuk DS-07.");
      }
      throw new Error("Pencarian web gagal ("+(e.code||"error")+").");
    }
  };
  const slim = (p, per=900) => {
    const rs = Array.isArray(p?.results) ? p.results : [];
    addSrc(rs);
    if (!rs.length) return typeof p === "string" ? p.slice(0, 12000) : JSON.stringify(p).slice(0, 12000);
    return rs.slice(0, 8).map((r,k) => ({n:k+1, title:r.title, url:r.url, tanggal:r.publish_date||undefined, cuplikan:(r.excerpts||[]).join(" … ").replace(/\s+/g," ").slice(0, per)}));
  };
  return [
    { name:"cari_web",
      description:"Cari di internet untuk informasi terbaru atau fakta yang perlu diverifikasi. Mengembalikan hingga 8 hasil {title,url,tanggal,cuplikan}. Kutip sumber dengan tautan markdown.",
      inputSchema:{type:"object",properties:{tujuan:{type:"string",description:"Apa yang dicari, satu kalimat"},kueri:{type:"array",items:{type:"string"},description:"2-3 kueri kata kunci, 3-6 kata"}},required:["tujuan","kueri"]},
      async execute(inp){
        const q = (Array.isArray(inp.kueri) ? inp.kueri : [String(inp.kueri||inp.tujuan||"")]).map(String).filter(Boolean).slice(0,4);
        const s = step("Memindai web: " + q.join(" · "));
        const p = await call("web_search", {objective:String(inp.tujuan||q[0]), search_queries:q, session_id:webSession});
        s.done = true; updateLast(); return slim(p);
      }},
    { name:"baca_halaman",
      description:"Baca isi halaman web tertentu bila cuplikan pencarian tidak cukup atau pengguna memberi URL. Mengembalikan cuplikan relevan per URL.",
      inputSchema:{type:"object",properties:{urls:{type:"array",items:{type:"string"}},tujuan:{type:"string"}},required:["urls"]},
      async execute(inp){
        const urls = (Array.isArray(inp.urls)?inp.urls:[inp.urls]).map(String).filter(u=>/^https?:\/\//.test(u)).slice(0,5);
        if (!urls.length) throw new Error("URL tidak valid.");
        const s = step("Membaca: " + urls.map(u=>{try{return new URL(u).hostname}catch{return u}}).join(", "));
        const p = await call("web_fetch", {urls, objective:String(inp.tujuan||"Isi utama halaman").slice(0,200), session_id:webSession});
        s.done = true; updateLast(); return slim(p, 3500);
      }}
  ];
}

function coreTools(m){

    { name:"simpan_ingatan",
      description:"USULKAN satu fakta penting dan tahan lama tentang pengguna (preferensi, pekerjaan, proyek, nama orang dekat) untuk diingat lintas percakapan. Pengguna akan menyetujui atau menolak. Jangan usulkan hal sepele, rahasia (kata sandi, nomor kartu), atau yang sudah ada di daftar ingatan.",
      inputSchema:{type:"object",properties:{fakta:{type:"string",description:"Satu kalimat singkat, sudut pandang orang ketiga, mis. 'Pengguna bekerja sebagai desainer grafis.'"}},required:["fakta"]},
      execute(inp){

        if (!t) throw new Error("Fakta kosong.");
        if (m.proposals.length >= 3) return "Batas usulan per jawaban tercapai.";
        m.proposals.push({text:t}); updateLast();
        return "Diusulkan ke pengguna; tersimpan hanya bila ia menyetujui. Jangan ulangi di jawaban.";
      }},
    { name:"cari_arsip",
      description:"Cari kata kunci di percakapan lama pengguna dengan DS-07. Mengembalikan hingga 6 cuplikan {judul, tanggal, cuplikan}.",
      inputSchema:{type:"object",properties:{kata_kunci:{type:"string"}},required:["kata_kunci"]},
      execute(inp){
        const words = String(inp.kata_kunci||"").toLowerCase().split(/\s+/).filter(w=>w.length>1);
        if (!words.length) throw new Error("Kata kunci kosong.");
        const s = {t:"Membuka arsip: "+words.join(" "), done:false}; m.scan.push(s); updateLast();
        const hits = [];
        for (const c of S.convs){
          if (c.id === S.convId) continue;
          for (const msg of (c.messages||[])){
            const low = (msg.text||"").toLowerCase();
            const score = words.filter(w=>low.includes(w)).length;
            if (score){
              const at = Math.max(0, low.indexOf(words.find(w=>low.includes(w))) - 120);
              hits.push({score, judul:c.title, tanggal:new Date(c.updated||c.created).toISOString().slice(0,10), dari:msg.role==="user"?"pengguna":"DS-07", cuplikan:msg.text.slice(at, at+420)});
            }
          }
        }
        s.done = true; updateLast();
        hits.sort((a,b)=>b.score-a.score);
        return hits.length ? hits.slice(0,6).map(({score,...h})=>h) : "Tidak ada yang cocok di arsip.";
      }}
  ];
}

/* ===================== MENYUSUN PROMPT ===================== */
function userContent(m, full){
  let t = m.text || "";
  if (m.attText?.length){
    if (full) t += m.attText.map(a => `\n\n[Lampiran: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``).join("");
    else t += `\n\n[Lampiran sebelumnya: ${m.attText.map(a=>a.name).join(", ")} — isinya sudah dibahas di atas]`;
  }
  if (m.imgNames?.length) t += `\n\n[${full?"Gambar terlampir":"Gambar sebelumnya"}: ${m.imgNames.join(", ")}]`;
  return t;
}
function buildMessages(){
  const msgs = S.cur.messages.filter(m => !(m.role === "assistant" && !m.done));
  const conv = [];
  const lastUserIdx = msgs.map(m=>m.role).lastIndexOf("user");
  msgs.forEach((m, i) => {
    if (m.role === "user") conv.push({role:"user", content:userContent(m, i >= lastUserIdx - 4)});
    else if (extOfMsg(m)) conv.push({role:"user", content:`[Jawaban dari ${EXT[m.src].name}, ditempel pengguna]\n` + m.text});
    else if (m.text) conv.push({role:"assistant", content:m.text + (m.error ? "\n[jawaban terputus]" : "")});
  });
  // gabungkan peran berurutan yang sama (mis. setelah jawaban gagal kosong)
  const merged = [];
  for (const m of conv){ const p = merged[merged.length-1]; if (p && p.role === m.role) p.content += "\n\n" + m.content; else merged.push({...m}); }
  while (merged.length && merged[0].role !== "user") merged.shift();
  const sys = personaPrompt();
  const max = (S.limits?.maxPromptBytes || 400000) * 0.85;
  let out;
  for (;;){
    out = merged.map((m,i) => i === 0 ? {...m, content: sys + "\n\n" + m.content} : m);
    if (bytes(JSON.stringify(out)) < max || merged.length <= 1) break;
    merged.splice(0, 2);
    while (merged.length && merged[0].role !== "user") merged.shift();
  }
  if (bytes(JSON.stringify(out)) >= max){
    const last = out[out.length-1];
    last.content = last.content.slice(0, Math.floor(max*0.7)) + "\n[… lampiran dipotong karena terlalu panjang]";
  }
  return out;
}

async function run(images){
  const m = {role:"assistant", text:"", at:Date.now(), mode:S.mode, modeLabel:MODE_LABEL[S.mode], scan:[], sources:[], proposals:[], done:false};
  const conv = S.cur; S.liveConv = conv;
  conv.messages.push(m);
  S.busy = true; S.localDirty = true; setBusyUi(true);
  $("#log").setAttribute("aria-live","off"); $("#log").setAttribute("aria-busy","true");
  setStatus(S.mode === "ovf" ? "Overflow · menalar" : "Memproses", true);
  renderLog(); renderSide();
  const ctl = new AbortController(); S.ctl = ctl;
  const tools = S.limits?.tools ? [...(S.webOn && S.mcp ? webTools(m) : []), ...opsTools(m), ...coreTools(m)].slice(0, S.limits.tools.maxCount || 8) : undefined;
  const opts = {
    signal: ctl.signal, cache:false,
    modelTier: S.mode === "ovf" ? "complex" : S.mode === "quick" ? "quick" : "default",
    onText: ({text}) => { m.text = text; updateLast(); },
  };
  if (tools?.length) opts.tools = tools;
  if (images.length) opts.images = images;
  try{
    const r = await S.sample(buildMessages(), opts);
    m.text = r.text;
    if (r.truncated) m.text += "\n\n_(Jawaban terpotong karena batas panjang — minta “lanjutkan”.)_";
    document.body.classList.add("blink"); setTimeout(() => document.body.classList.remove("blink"), 300);
  }catch(e){
    m.text = e?.text || m.text || "";
    m.error = sampleError(e);
    if (e?.reason === "usage_limit") m.usage = true;
  }finally{
    m.done = true; m.scan.forEach(s=>s.done = true);
    S.busy = false; S.ctl = null; setBusyUi(false); setStatus("Siaga", false);
    $("#log").setAttribute("aria-busy","false"); $("#log").setAttribute("aria-live","polite");
    announce(m.error ? "DS-07: " + m.error : "DS-07 selesai menjawab.");

    if (S.cur === conv) renderLog();

  }

function sampleError(e){

  if (c === "not_granted") return "Akses ke Claude belum diizinkan. Izinkan dari menu izin artifact, lalu coba lagi.";
  if (c === "rate_limited") return e.reason === "usage_limit" ? `Kuota akun ${S.me?.name ? "“"+S.me.name+"” " : ""}sudah habis. Pindah ke akun claude.ai lain untuk lanjut — riwayatmu ikut.` : "Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.";
  if (c === "prompt_too_large") return "Percakapan atau lampiran terlalu panjang. Mulai percakapan baru atau kirim file yang lebih kecil.";

async function speak(text){
  if (!S.tts) return;
  const t = plain(text);
  const lines = []; let cur = "";
  for (const para of t.split("\n")){
    if ((cur + "\n" + para).length > 1800){ if (cur) lines.push(cur); cur = para.slice(0, 1800); }
    else cur = cur ? cur + "\n" + para : para;
    if (lines.length >= 4) break;
  }
  if (cur && lines.length < 5) lines.push(cur);
  try{ await S.tts.speak(lines.filter(Boolean).map(x => ({text:x})), {voice:S.ttsVoice}); }
  catch(e){ if (e?.code === "not_granted"){ S.tts = null; syncToggles(); } else if (e?.code !== "busy" && e?.reason !== "viewer_stopped") toast("Suara tidak bisa diputar sekarang."); }
}

  const c = $("#rain"); const x = c.getContext("2d"); let W, H, drops = [];
  const size = () => { const d = Math.min(devicePixelRatio||1, 2); W = c.width = innerWidth*d; H = c.height = innerHeight*d; c.style.width = innerWidth+"px"; c.style.height = innerHeight+"px";
    const n = Math.round(Math.min(90, innerWidth/16)); drops = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, l:(8+Math.random()*22)*d, v:(4+Math.random()*7)*d, a:.06+Math.random()*.18, r:Math.random()<.18})); };
  size(); addEventListener("resize", size);
  const draw = () => {
    x.clearRect(0,0,W,H);
    for (const p of drops){
      x.strokeStyle = p.r ? `rgba(255,59,79,${p.a*1.4})` : `rgba(201,206,214,${p.a})`;
      x.lineWidth = p.r ? 1.2 : 1; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x - p.l*.12, p.y + p.l); x.stroke();
      if (!reduced && !(S.rainFreeze > performance.now())){ p.y += p.v; p.x -= p.v*.12; if (p.y > H){ p.y = -p.l; p.x = Math.random()*W*1.1; } }
    }
    if (!reduced && !document.hidden && S.rainOn) requestAnimationFrame(draw);
  };
  S.rainKick = () => requestAnimationFrame(draw);
  $("#rain").hidden = !S.rainOn;
  draw();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduced && S.rainOn) requestAnimationFrame(draw); });
}

/* ===================== PROTOKOL BRIEFING =====================
   Pembuka bersuara: DS-07 "bangun" (tahan untuk menyalakan), lalu membacakan laporan Design Ops
   mengikuti beat CombatOS — CALM → DETECTION (radar Threat Echo) → FIRST STRIKE (kunci sasaran)
   → POSITIONING (beban tim) → BREATH → MONEY FRAME (saran emas) → AFTERMATH (kembali ke chat).
   Data: ops/lap_<tanggal>.brief dari tugas cloud harian; tanpa brief, memakai ringkas + md. */
const BF = {el:null, raf:0, nodes:[], ripples:[], sparks:[], segs:[], paused:false, skip:false, stopped:true,
  voice:lsGet("ds07.bfVoice", true), sfx:lsGet("ds07.bfSfx", true), ac:null, drone:null, sweep:0, freezeUntil:0,
  lastRipple:0, autoTried:false, report:null};
const bfLatest = () => S.ops.reports?.[0] || null;
const bfClean = t => String(t || "").replace(/\*\*|__|`|#+\s*/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();

/* ---------- suara sintetis (WebAudio, tanpa file) ---------- */
function bfAudio(){
  if (BF.ac || !BF.sfx) return BF.ac;
  try{ BF.ac = new (window.AudioContext || window.webkitAudioContext)(); }catch{ BF.ac = null; }
  return BF.ac;
}
function bfTone(kind){
  const ac = BF.sfx ? bfAudio() : null; if (!ac) return;
  const t = ac.currentTime, out = ac.createGain(); out.connect(ac.destination);
  const osc = (type, f0, f1, dur, vol, delay = 0) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t + delay); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + delay + dur);
    g.gain.setValueAtTime(0.0001, t + delay); g.gain.exponentialRampToValueAtTime(vol, t + delay + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
    o.connect(g); g.connect(out); o.start(t + delay); o.stop(t + delay + dur + 0.05);
  };
  if (kind === "ignite"){ osc("sine", 38, 120, 1.1, 0.35); osc("sawtooth", 80, 640, 0.9, 0.04);
    const n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const f = ac.createBiquadFilter(), g = ac.createGain(); f.type = "lowpass"; f.frequency.value = 900; g.gain.value = 0.18;
    n.buffer = b; n.connect(f); f.connect(g); g.connect(out); n.start(t + 0.05); }
  if (kind === "thump") osc("sine", 70, 38, 0.45, 0.4);
  if (kind === "ping") osc("sine", 1500, 1300, 0.12, 0.025);
  if (kind === "lock"){ osc("square", 880, 0, 0.06, 0.03); osc("square", 1320, 0, 0.08, 0.03, 0.09); }
  if (kind === "gold"){ [523, 659, 784].forEach((f, i) => osc("triangle", f, 0, 0.9, 0.05, i * 0.06)); }
  if (kind === "tick") osc("square", 2400, 0, 0.02, 0.012);
}
function bfDrone(on){
  const ac = BF.sfx ? bfAudio() : null;
  if (!on || !ac){ if (BF.drone){ try{ BF.drone.g.gain.setTargetAtTime(0.0001, BF.ac.currentTime, 0.3); BF.drone.o.forEach(o => o.stop(BF.ac.currentTime + 1)); }catch{} BF.drone = null; } return; }
  if (BF.drone) return;
  const g = ac.createGain(); g.gain.value = 0.0001; g.connect(ac.destination);
  const o = [46, 69.2].map(f => { const x = ac.createOscillator(); x.type = "sine"; x.frequency.value = f; x.connect(g); x.start(); return x; });
  g.gain.setTargetAtTime(0.018, ac.currentTime, 1.2); BF.drone = {g, o};
}

/* ---------- naskah dari laporan ---------- */
function bfScript(r){
  const b = r.brief, hi = S.me?.name ? greeting().replace(/\.$/, "") + ", " + S.me.name + "." : greeting();
  const segs = [{beat:["01","CALM"], say:`${hi} Saya kembali. Ini laporan tim desain, ${b?.tanggal || fmtDate(r.date)}.`}];
  if (b){
    const ps = (b.projects || []).slice(0, 16);
    segs.push({beat:["02","DETECTION"], nodes:ps,
      say:`Threat Echo aktif. ${b.aktif} project aktif terdeteksi. ${b.terlambat ? `${b.terlambat} sudah melewati deadline` : "Tidak ada yang terlambat"}${b.hariIni ? `, ${b.hariIni} jatuh tempo hari ini` : ""}${b.besok ? `, ${b.besok} besok` : ""}.`});
    const hot = ps.filter(p => (p.telatHari || 0) > 0 || (p.sisaHari != null && p.sisaHari <= 1)).slice(0, 3);
    if (hot.length) hot.forEach((p, k) => segs.push({beat:["03","FIRST STRIKE"], lock:p, k, of:hot.length,
      say:`${p.bu ? p.bu + ", " : ""}${p.nama}. PIC ${p.pic || "belum ada"}. ${(p.telatHari || 0) > 0 ? `Terlambat ${p.telatHari} hari` : p.sisaHari === 0 ? "Deadline hari ini" : "Deadline besok"}, status ${p.status || "-"}.`}));
    else segs.push({beat:["03","FIRST STRIKE"], say:"Tidak ada sasaran kritis. Semua project masih di jalurnya."});
    const be = (b.beban || []).slice(0, 6);
    if (be.length){
      const top = be.slice(0, 2).map(x => `${x.pic} memegang ${x.aktif} project${x.terlambat ? `, ${x.terlambat} terlambat` : ""}`).join(". ");
      segs.push({beat:["04","POSITIONING"], load:be, say:`Beban tim. ${top}.${b.tanpaPic ? ` ${b.tanpaPic} project belum punya PIC.` : ""}`});
    }
    segs.push({beat:["05","BREATH"], flow:b,
      say:`${b.baru ? `${b.baru} project baru masuk` : "Tidak ada project baru"}. ${b.selesai ? `${b.selesai} selesai${(b.selesaiList || [])[0] ? ", termasuk " + b.selesaiList[0] : ""}.` : "Belum ada yang selesai sejak laporan terakhir."}`});
    if ((b.saran || []).length) segs.push({beat:["06","MONEY FRAME"], gold:b.saran.slice(0, 3), say:`Saran saya. ${b.saran.slice(0, 3).join(" ")}`});
  } else {
    // laporan lama tanpa data terstruktur: bacakan ringkasan dan butir dari markdown
    const sec = h => { const m = String(r.md || "").split(/\n(?=## )/).find(x => x.toLowerCase().startsWith("## " + h)); return m ? m.split("\n").filter(l => /^\s*[-*\d]/.test(l)).map(bfClean).map(l => l.replace(/^[-*\d.)\s]+/, "")).filter(Boolean) : []; };
    segs.push({beat:["02","DETECTION"], say:bfClean(r.ringkas) || "Laporan diterima."});
    sec("perlu tindakan").slice(0, 3).forEach(l => segs.push({beat:["03","FIRST STRIKE"], say:l, card:l}));
    const sar = sec("saran").slice(0, 3);
    if (sar.length) segs.push({beat:["06","MONEY FRAME"], gold:sar, say:"Saran saya. " + sar.join(" ")});
  }
  segs.push({beat:["07","AFTERMATH"], end:true, say:"Itu saja. Saya di sini kalau kamu butuh."});
  return segs;
}

  tick();
}
function bfHoldSetup(){
  const btn = $("#bfHold"), core = $("#bfCore"), prog = $("#bfProg");
  let t0 = 0, raf = 0;
  const HOLD = reduced ? 1 : 900, C = 301.6;
  const step = () => { const k = Math.min(1, (performance.now() - t0) / HOLD); prog.setAttribute("stroke-dashoffset", String(C * (1 - k)));
    if (k >= 1){ t0 = 0; bfWake(); return; } if (k > 0 && Math.random() < .25) bfTone("tick"); raf = requestAnimationFrame(step); };
  const start = e => { if (BF.started || t0) return; e?.preventDefault?.(); bfAudio(); t0 = performance.now(); raf = requestAnimationFrame(step); };
  const cancel = () => { if (!t0) return; t0 = 0; cancelAnimationFrame(raf); prog.setAttribute("stroke-dashoffset", String(C)); };
  [btn, core].forEach(x => { x.addEventListener("pointerdown", start); x.addEventListener("pointerup", cancel); x.addEventListener("pointerleave", cancel); x.addEventListener("pointercancel", cancel); });
  btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); bfAudio(); bfWake(); } });
  btn.addEventListener("click", e => { if (e.detail === 0){ bfAudio(); bfWake(); } });   // aktivasi lewat pembaca layar
}
async function bfWake(){
  if (BF.started) return; BF.started = true;
  lsSet("ds07.briefed", BF.report.date);
  const core = $("#bfCore"); core.classList.add("lit"); $("#bfWake").remove(); $("#bfCtrl").hidden = false; $("#bfPause").focus();
  bfTone("ignite"); setTimeout(() => bfTone("thump"), 420);
  BF.freezeUntil = performance.now() + 160; S.rainFreeze = BF.freezeUntil;
  BF.ripples.push({r:0, v:9, a:1, big:true});
  if (!reduced){ BF.el.classList.add("shake"); setTimeout(() => BF.el?.classList.remove("shake"), 300); }
  bfDrone(true);
  await bfSleep(reduced ? 200 : 900);
  bfRun();
}
async function bfRun(){
  for (let i = 0; i < BF.segs.length; i++){
    if (BF.stopped) return;
    const s = BF.segs[i]; BF.skip = false; BF.idx = i;
    $("#bfBeat").innerHTML = `${esc(s.beat[0])} · <em>${esc(s.beat[1])}</em>`;
    bfStage(s);
    $("#bfSub").innerHTML = `<span class="who">DS-07</span>${esc(s.say)}`;
    await bfSay(s.say);
    await bfWaitPause();
    if (!BF.skip) await bfSleep(s.end ? 200 : 450);
  }
}
async function bfSay(text){
  BF.el?.classList.add("talk");
  try{
    if (S.tts && BF.voice) await S.tts.speak([{text, language:"id"}], {voice:S.ttsVoice, rate:0.98});
    else await bfSleep(Math.max(1600, text.split(/\s+/).length * 380));
  }catch{ /* dihentikan (lanjut/lewati) atau suara tidak tersedia */ if (!BF.skip && !BF.stopped && !(S.tts && BF.voice)) await bfSleep(1200); }
  BF.el?.classList.remove("talk");
}
async function bfSleep(ms){ let left = ms; while (left > 0 && !BF.skip && !BF.stopped){ await sleep(100); if (!BF.paused) left -= 100; } }
async function bfWaitPause(){ while (BF.paused && !BF.stopped && !BF.skip) await sleep(120); }
function bfTogglePause(){
  BF.paused = !BF.paused;
  const b = $("#bfPause"); if (b) b.querySelector("span").textContent = BF.paused ? "Lanjutkan" : "Jeda";
  if (S.tts && BF.voice){ (BF.paused ? S.tts.pause() : S.tts.resume()).catch(()=>{}); }
  BF.el?.classList.toggle("talk", !BF.paused && !!S.tts?.active?.());
}
function bfNext(){ BF.skip = true; if (BF.paused) bfTogglePause(); S.tts?.stop().catch(()=>{}); }

/* ---------- visual per beat ---------- */
function bfStage(s){
  const panel = $("#bfPanel"); const on = html => { panel.innerHTML = html; panel.classList.add("on"); BF.el.classList.add("bf-split"); setTimeout(bfPlace, 720); };
  const off = () => { panel.classList.remove("on"); BF.el.classList.remove("bf-split"); setTimeout(bfPlace, 720); };
  document.querySelectorAll(".bf-node.lock").forEach(n => n.classList.remove("lock"));
  if (s.nodes){ off(); bfSpawnNodes(s.nodes); return; }
  if (s.lock){
    const p = s.lock, late = (p.telatHari || 0) > 0, c = late ? "var(--red)" : "var(--amber)";
    const node = BF.nodes.find(n => n.p.id === p.id || n.p.nama === p.nama); if (node) node.el.classList.add("lock");
    bfTone("lock");
    on(`<div class="bf-card" style="--c:${c}"><small>Sasaran terkunci · ${s.k + 1}/${s.of}</small><div class="bu">${esc(p.bu || "")}</div><h3>${esc(p.nama)}</h3>
      <dl><dt>PIC</dt><dd>${esc(p.pic || "Belum ada")}</dd><dt>DEADLINE</dt><dd>${esc(p.deadline ? fmtDate(p.deadline) : "-")}</dd><dt>STATUS</dt><dd>${esc(p.status || "-")}</dd></dl>
      <div class="bf-big">${late ? "Terlambat" : "Sisa"} <b data-roll="${late ? p.telatHari : Math.max(0, p.sisaHari || 0)}">0</b> hari</div></div>`);
    bfRoll(panel.querySelector("[data-roll]")); return;
  }
  if (s.card){ bfTone("lock"); on(`<div class="bf-card"><small>Perlu tindakan</small><h3 style="font-size:20px">${esc(s.card)}</h3></div>`); return; }
  if (s.load){
    const max = Math.max(4, ...s.load.map(x => x.aktif));
    on(`<div class="bf-card" style="--c:var(--silver)"><small>Beban tim · energi armor</small><div class="bf-load">${s.load.map(x => {
      const cells = Array.from({length:8}, (_, k) => { const lim = Math.round(x.aktif / max * 8), red = Math.round(x.terlambat / max * 8); return k < lim ? (k >= lim - red ? "r" : "f") : ""; });
      return `<div class="row"><span>${esc(x.pic)}</span><span class="cells">${cells.map(c => `<i class="${c}"></i>`).join("")}</span><span class="n">${x.aktif}${x.terlambat ? ` · ${x.terlambat}!` : ""}</span></div>`; }).join("")}</div></div>`);
    return;
  }
  if (s.flow){
    const b = s.flow;
    on(`<div class="bf-card" style="--c:var(--silver)"><small>Arus project</small><div class="bf-flow">
      <div><h4>Masuk · ${b.baru || 0}</h4>${(b.masuk || []).length ? `<ul>${b.masuk.slice(0,4).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<p class=\"n\" style=\"margin:0;color:var(--muted)\">Tidak ada</p>"}</div>
      <div><h4>Selesai · ${b.selesai || 0}</h4>${(b.selesaiList || []).length ? `<ul>${b.selesaiList.slice(0,4).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<p style=\"margin:0;color:var(--muted)\">Tidak ada</p>"}</div></div></div>`);
    return;
  }
  if (s.gold){
    bfTone("gold"); BF.freezeUntil = performance.now() + 220; S.rainFreeze = BF.freezeUntil;
    const f = $("#bfFlash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    BF.ripples.push({r:0, v:7, a:1, gold:true});
    on(`<div class="bf-card bf-gold"><small>Money frame · saran</small><ol>${s.gold.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`);
    return;
  }
  if (s.end){
    on(`<div class="bf-card" style="--c:var(--red)"><small>Briefing selesai</small><h3>Kembali ke kanal komunikasi</h3>
      <div class="bf-end"><button class="btn red" type="button" data-bf-go>Masuk ke DS-07</button>
      <button class="btn" type="button" data-bf-ask>Tanya soal laporan ini</button>
      <button class="btn" type="button" data-bf-rep>Laporan lengkap</button>
      <button class="btn ghost" type="button" data-bf-again>Ulangi briefing</button></div></div>`);
    const P = $("#bfPanel");
    P.querySelector("[data-bf-go]").onclick = () => bfClose(true);
    P.querySelector("[data-bf-ask]").onclick = () => { const d = BF.report.date; bfClose(true); inp.value = `Dari laporan Design Ops ${d}: apa yang paling mendesak hari ini dan bagaimana urutan kerjanya?`; autoGrow(); inp.focus(); };
    P.querySelector("[data-bf-rep]").onclick = () => { const id = BF.report.id; bfClose(true); setTimeout(() => openReport(id), 750); };
    P.querySelector("[data-bf-again]").onclick = () => { bfClose(false, true); setTimeout(() => bfOpen(false), 650); };
    setTimeout(() => P.querySelector("[data-bf-go]")?.focus(), 50);
    return;
  }
  off();
}
function bfRoll(el){
  if (!el) return; const to = +el.dataset.roll || 0;
  if (reduced){ el.textContent = to; return; }
  const t0 = performance.now(), d = 800;
  const f = () => { const k = Math.min(1, (performance.now() - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); };
  f();
}
function bfSpawnNodes(ps){
  const stage = $("#bfStage"); if (!stage) return;
  stage.querySelectorAll(".bf-node").forEach(n => n.remove()); BF.nodes = [];
  ps.forEach((p, i) => {
    const late = (p.telatHari || 0) > 0, soon = !late && p.sisaHari != null && p.sisaHari <= 1;
    const rf = late ? 0.5 + 0.12 * Math.max(0, 1 - Math.min(p.telatHari, 30) / 30) : soon ? 0.72 : 0.9;   // makin terlambat makin dekat ke kepala
    const ang = -Math.PI / 2 + i * (Math.PI * 2 / Math.max(ps.length, 1)) + (i % 2 ? .12 : -.08);
    const b = document.createElement("button"); b.type = "button"; b.className = "bf-node" + (late ? " red" : soon ? " amb" : "");
    b.setAttribute("aria-label", `${p.bu ? p.bu + ", " : ""}${p.nama}. PIC ${p.pic || "belum ada"}. ${late ? "Terlambat " + p.telatHari + " hari" : p.deadline ? "Deadline " + fmtDate(p.deadline) : "Tanpa deadline"}`);
    b.innerHTML = `<i></i><span>${esc(String(p.bu || p.nama).slice(0, 12))}</span>`;
    b.onclick = () => { if (!BF.paused) bfTogglePause(); bfStage({lock:p, k:i, of:ps.length}); };
    stage.appendChild(b);
    BF.nodes.push({el:b, p, rf, ang, lit:false});
    setTimeout(() => b.classList.add("on"), reduced ? 0 : 120 + i * 70);
  });
  bfPlace();
}
function bfPlace(){
  const st = $("#bfStage"), core = $("#bfCore"); if (!st || !core) return;
  const s = st.getBoundingClientRect(), c = core.getBoundingClientRect();
  const cx = c.left - s.left + c.width / 2, cy = c.top - s.top + c.height / 2;
  const R = Math.min(s.width, s.height) * (BF.el.classList.contains("bf-split") && innerWidth > 760 ? .42 : .44);
  BF.cx = cx; BF.cy = cy; BF.R = R;
  BF.nodes.forEach(n => { n.x = cx + Math.cos(n.ang) * R * n.rf; n.y = cy + Math.sin(n.ang) * R * n.rf * .82; n.el.style.setProperty("--x", n.x + "px"); n.el.style.setProperty("--y", n.y + "px"); });
}

/* ---------- kanvas: cincin radar, sapuan, gema ancaman, bara ---------- */
function bfCanvas(){
  const cv = BF.el.querySelector("canvas"), x = cv.getContext("2d"); const dpr = Math.min(devicePixelRatio || 1, 2);
  const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; bfPlace(); };
  size(); BF.onResize = size; addEventListener("resize", size);
  const draw = now => {
    if (!BF.el) return;
    const frozen = now < BF.freezeUntil;
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, innerWidth, innerHeight);
    const st = $("#bfStage").getBoundingClientRect(), core = $("#bfCore").getBoundingClientRect();
    const cx = core.left + core.width / 2, cy = core.top + core.height / 2, R = BF.R || Math.min(st.width, st.height) * .44;
    // cincin
    x.lineWidth = 1;
    [0.5, 0.72, 0.9, 1.04].forEach((k, i) => { x.strokeStyle = i === 0 ? "#ff3b4f2e" : "#c9ced61a"; x.setLineDash(i === 3 ? [2, 6] : []); x.beginPath(); x.ellipse(cx, cy, R * k, R * k * .82, 0, 0, Math.PI * 2); x.stroke(); });
    x.setLineDash([]);
    if (BF.started){
      // sapuan radar
      if (!frozen && !reduced) BF.sweep += 0.012;
      const g = x.createConicGradient ? x.createConicGradient(BF.sweep, cx, cy) : null;
      if (g){ g.addColorStop(0, "#ff3b4f33"); g.addColorStop(.08, "#ff3b4f00"); g.addColorStop(1, "#ff3b4f00");
        x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, R * 1.04, R * 1.04 * .82, 0, 0, Math.PI * 2); x.fill(); }
      // gema ancaman tiap 2,6 detik
      if (!reduced && now - BF.lastRipple > 2600){ BF.lastRipple = now; BF.ripples.push({r:0, v:3.2, a:.9}); }
      BF.ripples = BF.ripples.filter(rp => rp.a > 0.02 && rp.r < R * 1.3);
      BF.ripples.forEach(rp => {
        if (!frozen) { rp.r += rp.v; rp.a *= rp.big || rp.gold ? .965 : .985; }
        x.strokeStyle = rp.gold ? `rgba(255,215,106,${rp.a})` : `rgba(255,59,79,${rp.a * .7})`; x.lineWidth = rp.big || rp.gold ? 2.5 : 1.2;
        x.beginPath(); x.ellipse(cx, cy, rp.r, rp.r * .82, 0, 0, Math.PI * 2); x.stroke();
        BF.nodes.forEach(n => { const d = R * n.rf; if (!rp.big && !rp.gold && Math.abs(rp.r - d) < rp.v && !n.el.classList.contains("ping")){ n.el.classList.add("ping"); if (n.el.classList.contains("red")) bfTone("ping"); setTimeout(() => n.el.classList.remove("ping"), 380); } });
      });
      // garis kunci ke sasaran
      const lk = BF.nodes.find(n => n.el.classList.contains("lock"));
      if (lk){ const sx = st.left + lk.x, sy = st.top + lk.y; x.strokeStyle = "#ff3b4f99"; x.setLineDash([4, 5]); x.lineWidth = 1; x.beginPath(); x.moveTo(cx, cy); x.lineTo(sx, sy); x.stroke(); x.setLineDash([]); }
      // bara naik
      if (!reduced && !frozen && Math.random() < .35) BF.sparks.push({x:cx + (Math.random() - .5) * R * 1.6, y:innerHeight + 10, v:.6 + Math.random() * 1.4, a:.5 + Math.random() * .4, s:1 + Math.random() * 1.6});
      BF.sparks = BF.sparks.filter(p => p.y > -10 && p.a > .03);
      BF.sparks.forEach(p => { if (!frozen){ p.y -= p.v; p.x += Math.sin(p.y / 40) * .3; p.a *= .996; } x.fillStyle = `rgba(255,${80 + (p.s * 30 | 0)},79,${p.a})`; x.fillRect(p.x, p.y, p.s, p.s * 2.2); });
    }
    BF.raf = requestAnimationFrame(draw);
  };
  BF.raf = requestAnimationFrame(draw);
}

/* ---------- keluar: kepala menyusut ke avatar di header ---------- */
function bfClose(toChat, quick){
  if (!BF.el) return;
  BF.stopped = true; BF.started = false; S.tts?.stop().catch(()=>{}); bfDrone(false);
  lsSet("ds07.briefed", BF.report?.date || "");
  const el = BF.el, core = $("#bfCore"), target = document.querySelector(".ident .ava");
  if (toChat && target && !reduced && !quick){
    const a = core.getBoundingClientRect(), b = target.getBoundingClientRect();
    const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2), k = b.width / a.width;
    core.style.transition = "transform 750ms cubic-bezier(.65,0,.35,1)";
    core.style.transform = `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${k})`;
    el.querySelectorAll(".bf-top,.bf-bottom,.bf-panel,.bf-node").forEach(n => { n.style.transition = "opacity 300ms"; n.style.opacity = "0"; });
  }
  el.classList.add("out");
  setTimeout(() => {
    cancelAnimationFrame(BF.raf); removeEventListener("resize", BF.onResize); el.remove(); BF.el = null;
    if (toChat){ document.body.classList.add("blink"); setTimeout(() => document.body.classList.remove("blink"), 300); }
    (toChat ? inp : BF.prevFocus || inp)?.focus?.();
  }, quick ? 300 : 800);
}
function bfMaybeAuto(){
  if (BF.autoTried || BF.el) return;
  const r = bfLatest(); if (!r) return;
  BF.autoTried = true;
  if (r.date !== todayISO() || lsGet("ds07.briefed", "") === r.date || !lsGet("ds07.autoBrief", true)) return;
  if ($("#dlgHost").innerHTML || S.busy || (S.cur?.messages || []).length) return;
  bfOpen(true);
}
$("#bfBtn").onclick = () => bfOpen(false);
